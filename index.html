   <div class="grid" style="margin-top:10px">${fld("Dung môi pha mẫu", inp("inj.diluent", {ph: "Ví dụ: Methanol – nước 70:30"}))}${fld("% hữu cơ trong dung môi pha mẫu", inp("inj.dilOrg", {num: 1, ph: "Ví dụ: 70"}))}${fld("Chế độ tiêm", sel("inj.mode", {std: "Tiêm thông thường", sandwich: "Tiêm sandwich có nút khí", sandwichNoAir: "Tiêm sandwich không có nút khí"}))}
   ${on ? fld("Dung môi yếu", inp("inj.weak", {ph: "Ví dụ: Nước tinh khiết"})) + fld("% hữu cơ của dung môi yếu", inp("inj.weakOrg", {num: 1, ph: "0"})) + fld("Thể tích nút dung môi yếu, µl", inp("inj.plug", {num: 1, ph: "5"})) + (I.mode === "sandwich" ? fld("Thể tích mỗi nút khí, µl", inp("inj.air", {num: 1, ph: "1"})) : "") + fld("Vị trí lọ dung môi yếu", inp("inj.vial", {ph: "Ví dụ: Vial 1"})) : ""}</div>
   ${c ? flagHtml([{k: c.k, t: c.k === "ok" ? `Dung môi pha mẫu chứa ${fmt(c.d, 0)}% hữu cơ, không mạnh hơn đáng kể so với pha động ban đầu thấp nhất (${c.lo.pp}: ${fmt(c.lo.org, 1)}%).` : `Dung môi pha mẫu chứa ${fmt(c.d, 0)}% hữu cơ, cao hơn pha động ban đầu thấp nhất ${fmt(c.gap, 0)} điểm % (${c.lo.pp}: ${fmt(c.lo.org, 1)}%). Có nguy cơ xảy ra hiệu ứng dung môi mạnh ở các pic rửa giải sớm; thể tích tiêm hiện tại là ${fmt(inj, 0)} µl, bằng ${fmt(inj / (v0 || 1) * 100, 1)}% thể tích chết của cột.`}]) : `<p class="hint">Nhập % hữu cơ của dung môi pha mẫu để ứng dụng so sánh với thành phần pha động ban đầu của từng phương pháp.</p>`}
   <div class="kb" style="margin-top:8px"><b>Hiệu ứng dung môi mạnh</b><ul>
    <li>Hiệu ứng xảy ra khi dung môi pha mẫu có sức rửa giải lớn hơn pha động ban đầu: trong sắc ký pha đảo là dung môi có % hữu cơ cao hơn, trong HILIC là dung môi có % nước cao hơn.</li>
    <li>Phần chất phân tích nằm trong lõi dải mẫu di chuyển nhanh hơn trước khi dung môi pha mẫu được pha loãng bởi pha động, gây pic tù đầu, pic tách đôi hoặc pic giãn rộng, rõ nhất ở các pic rửa giải sớm.</li>
    <li>Mức độ ảnh hưởng tăng theo chênh lệch sức rửa giải giữa dung môi pha mẫu và pha động ban đầu, và theo tỷ lệ giữa thể tích tiêm và kích thước cột.</li>
    <li>Thứ tự xử lý khuyến nghị: pha mẫu trong dung môi có thành phần gần với pha động ban đầu nếu độ tan và độ ổn định cho phép; giảm thể tích tiêm; cuối cùng mới áp dụng chương trình tiêm sandwich.</li></ul>
    <b>Chương trình tiêm sandwich</b><ul>
    <li>Kim tiêm hút lần lượt: nút khí, dung môi yếu, dung dịch mẫu; sau đó kim được rửa, rồi hút tiếp dung môi yếu và nút khí. Khi van tiêm chuyển vị trí, hai nút dung môi yếu ở hai phía trộn và pha loãng dải mẫu ngay trước đầu cột, giúp chất phân tích hội tụ thành dải hẹp.</li>
    <li>Nút khí đóng vai trò vách ngăn vật lý, ngăn chặn sự khuếch tán dọc trục của dung dịch mẫu trong kim tiêm; nhờ đó dải mẫu không bị giãn rộng trước khi vào cột và pic không bị giãn.</li>
    <li>Nút khí đặc biệt quan trọng khi thời gian rửa kim kéo dài: trong lúc kim đứng yên để rửa, dải mẫu trong kim có thời gian khuếch tán dọc trục. Thời gian rửa kim càng dài, dải mẫu khuếch tán càng rộng và số đĩa lý thuyết càng thấp.</li>
    <li>Cần xác nhận bộ tiêm mẫu tự động hỗ trợ chương trình tiêm và cho phép hút không khí, ví dụ Injector Program của Agilent, Pretreatment Program của Shimadzu hoặc Custom Injection Program của Thermo Vanquish. Với hệ kim không cho phép hút không khí, chọn chế độ tiêm sandwich không có nút khí.</li>
    <li>Tổng thể tích hút phải nhỏ hơn dung tích của vòng mẫu hoặc kim tiêm. Dung môi yếu trong sắc ký pha đảo thường là nước hoặc pha nước của pha động; trong HILIC là acetonitril.</li>
    <li>Khi chuyển sang chương trình tiêm sandwich, cần đánh giá lại độ lặp lại của diện tích pic (n = 6) và độ tuyến tính, đồng thời ghi chương trình tiêm vào phương pháp phân tích.</li></ul></div>
   ${on ? `<h3 style="margin:12px 0 6px;color:var(--navy);font-size:0.8438rem">Chương trình tiêm đề xuất <button class="btn sm" data-a="copyInjProg" style="margin-left:8px">Sao chép</button></h3><ol style="margin:0 0 0 18px;font-size:0.8125rem">${pg.lines.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
    <p class="hint">Tổng thể tích hút là ${fmt(pg.total)} µl.${mix !== null ? ` Khi trộn hoàn toàn, dải tiêm chứa khoảng ${fmt(mix, 0)}% hữu cơ, so với ${fmt(num(I.dilOrg), 0)}% của dung môi pha mẫu.` : ""} Thời gian chạy và lượng pha động của trình tự tiêm không thay đổi.</p>` : ""}</details>`;
}

/* ============ Cỡ chữ: A− / A+ trên header, nhớ theo trình duyệt ============ */
const ZOOMS = [0.9, 1, 1.1, 1.25, 1.4, 1.6, 1.8], ZOOM_DEF = 1.1;
function applyZoom(){ let z = Number(lsGet("aqbd-zoom")); if (!ZOOMS.includes(z)) z = ZOOM_DEF; document.documentElement.style.fontSize = (16 * z) + "px"; const e = document.getElementById("zoomVal"); if (e) e.textContent = Math.round(z * 100) + "%"; requestAnimationFrame(() => autosizeAll()); return z; }
function setZoom(a){ const z = Number(lsGet("aqbd-zoom")) || ZOOM_DEF; const i = Math.max(0, ZOOMS.indexOf(ZOOMS.includes(z) ? z : ZOOM_DEF)); const nz = a === "zoomReset" ? ZOOM_DEF : ZOOMS[Math.min(ZOOMS.length - 1, Math.max(0, i + (a === "zoomIn" ? 1 : -1)))]; lsSet("aqbd-zoom", String(nz)); applyZoom(); toast("Cỡ chữ " + Math.round(nz * 100) + "%"); }
applyZoom();
applyTheme(); 
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); } catch(e){}

/* ============ Bước 2: kênh bơm, giải thích loại yếu tố, kiểm tra tại góc khảo sát, ngữ cảnh AI ============ */
function chanCard(){
  const ch = P.channels.map((c, i) => `<tr><td class="id">${c.ch}</td><td class="l">${inp(`channels.${i}.name`, {w:"190px", ph:"Dung môi hoặc dung dịch"})}</td><td class="l">${sel(`channels.${i}.role`, ROLES)}</td><td>${c.role === "fixed" || c.role === "buffer" ? inp(`channels.${i}.pct`, {num:1, w:"80px", ph:"%"}) : c.role === "phbottle" ? inp(`channels.${i}.ph`, {num:1, w:"80px", ph:"pH"}) : "—"}</td></tr>`).join("");
  return `<div class="card"><h2>Kênh bơm và dung môi của pha động</h2>
   <div class="tw">${tb([1, 3.6, 3.6, 2])}<thead><tr><th>Kênh</th><th>Dung môi hoặc dung dịch</th><th>Vai trò</th><th>% cố định hoặc pH</th></tr></thead><tbody>${ch}</tbody></table></div>
   <p class="hint">Cần đúng một kênh có vai trò “Pha nước – nhận phần còn lại”; kênh này nhận phần trăm còn lại để tổng các kênh bằng 100%. Thông tin kênh bơm được dùng cho đánh giá rủi ro ở bước này và cho việc quy đổi ma trận ở bước 3.</p></div>`;
}
function fixedPct(){ return activeChannels().filter(c => c.role === "fixed" || c.role === "buffer").reduce((a, c) => a + (num(c.pct) || 0), 0); }
function factorTypeNote(){
  const used = P.factors.some(f => f.type === "total_org" || f.type === "total_org_free"); const fx = fixedPct();
  if (!used && !fx) return "";
  const v = 60, rest = 100 - fx;
  return `<p class="hint"><b>% hữu cơ trên toàn pha động</b>: giá trị yếu tố là tỷ lệ dung môi hữu cơ so với toàn bộ pha động. <b>% hữu cơ trên phần không cố định</b>: giá trị yếu tố là tỷ lệ dung môi hữu cơ trong phần pha động còn lại sau khi trừ các kênh cố định${fx ? ` (hiện là ${fmt(fx)}%)` : ""}. ${fx ? `Ví dụ với giá trị ${v}: kiểu thứ nhất cho ${v}% hữu cơ, ${fmt(fx)}% kênh cố định và ${fmt(100 - v - fx)}% pha nước; kiểu thứ hai cho ${fmt(v * rest / 100)}% hữu cơ, ${fmt(fx)}% kênh cố định và ${fmt((100 - v) * rest / 100)}% pha nước, tức tỷ lệ hữu cơ : pha nước đúng ${v} : ${100 - v} như khai báo.` : "Khi không có kênh cố định, hai kiểu cho cùng kết quả."} Chọn kiểu khớp với cách yếu tố được định nghĩa trong Design-Expert và cách ghi thành phần pha động trong phương pháp.</p>`;
}
function rangeCornerChecks(){
  const fs = P.factors.filter(f => num(f.low) !== null && num(f.high) !== null); if (!fs.length || fs.length > 6 || !activeChannels().length) return [];
  const map = new Map();
  for (let m = 0; m < (1 << fs.length); m++){
    const row = {}; fs.forEach((f, i) => row[f.key] = (m >> i) & 1 ? num(f.high) : num(f.low));
    let t; try { t = translatePoint(row); } catch(e){ continue; }
    (t.warn || []).filter(w => !w.s3).forEach(w => { const key = w.t; const lab = fs.map(f => `${f.key} = ${fmt(row[f.key])}`).join(", "); if (!map.has(key)) map.set(key, {k: w.k, t: w.t, at: [lab]}); else if (map.get(key).at.length < 2) map.get(key).at.push(lab); });
  }
  return [...map.values()].map(x => ({k: x.k, t: `Tại góc khảo sát ${x.at.join("; ")}${x.at.length > 1 ? " và các góc khác" : ""}: ${x.t}`}));
}
function blankFields(){
  const out = [], E = v => v === null || v === undefined || String(v).trim() === "";
  const add = (cond, f, st, c) => { if (cond) out.push({f, s: st, c}); };
  const b = P.base, A = P.api;
  add(E(A.name), "Hoạt chất", 1, "Thông tin chung"); add(E(A.method), "Phương pháp", 1, "Thông tin chung"); add(E(A.test), "Chỉ tiêu phân tích", 1, "Thông tin chung");
  add(!P.peaks.length, "Danh sách pic", 1, "Pic theo thứ tự rửa giải"); add(!P.responses.length, "Đáp ứng CQA", 1, "Đáp ứng CQA và tiêu chí ATP");
  P.responses.forEach(r => { const a = r.acc || {}; add(!a.op || a.op === "none" || (a.op === "range" ? E(a.lo) && E(a.hi) : E(a.val)), `Tiêu chí chấp nhận của ${r.key}`, 1, "Đáp ứng CQA và tiêu chí ATP"); });
  P.factors.forEach(f => { add(E(f.name), `Tên yếu tố ${f.key}`, 2, "Thiết kế và yếu tố DoE"); add(E(f.low) || E(f.high), `Mức thấp hoặc mức cao của yếu tố ${f.key}`, 2, "Thiết kế và yếu tố DoE"); });
  activeChannels().forEach(c => add(E(c.name), `Tên dung môi của kênh ${c.ch}`, 2, "Kênh bơm và dung môi của pha động"));
  const PW = "Pha nước và hệ đệm";
  if (!phFactor()) add(E(b.ph), "pH của pha nước", 2, PW);
  add(E(b.buffer), "Đệm hoặc phụ gia", 2, PW); add(E(b.bufferPka), "pKa của hệ đệm", 2, PW); add(E(b.bufferMM), "Nồng độ đệm trong pha nước", 2, PW);
  const C = "Cột và thiết bị";
  [["column", "Cột"], ["L", "Chiều dài cột"], ["d", "Đường kính trong"], ["dp", "Kích thước hạt"], ["colPhMin", "pH cột thấp nhất"], ["colPhMax", "pH cột cao nhất"], ["colTmax", "Nhiệt độ tối đa của cột"], ["pmax", "Áp suất tối đa của hệ thống"]].forEach(([k, l]) => add(E(b[k]), l, 2, C));
  P.analytes.forEach(a => add(E(a.pka), `pKa của ${a.name || "chất chưa đặt tên"}`, 2, "Chất phân tích và pKa"));
  return out;
}
function riskCtx(){
  const b = P.base, L = [];
  L.push("Dữ liệu bước 1:");
  L.push(`Hoạt chất: ${P.api.name || "chưa nhập"}. Dạng bào chế: ${P.api.dosage || "chưa nhập"}. Phương pháp: ${P.api.method || "chưa nhập"}. Chỉ tiêu: ${P.api.test || "chưa nhập"}.`);
  L.push(`Pic theo thứ tự rửa giải: ${P.peaks.join(" → ") || "chưa nhập"}.`);
  L.push("Đáp ứng và tiêu chí: " + (P.responses.map(r => `${r.key} ${r.name} [${accText(r)}]`).join("; ") || "chưa nhập") + ".");
  L.push("Dữ liệu bước 2:");
  L.push(`Kiểu thiết kế: ${DTYPES[P.designType] || P.designType || "chưa chọn"}. Chế độ rửa giải: ${isGrad() ? "gradient" : "đẳng dòng"}. FDS: ${P.fds || "chưa nhập"}.`);
  L.push("Yếu tố khảo sát: " + (P.factors.map(f => `${f.key}: ${f.name} (${f.unit || ""}) ${f.low}–${f.high}, loại “${FTYPES[f.type] ? FTYPES[f.type].l : f.type}”`).join("; ") || "chưa nhập") + ".");
  L.push("Kênh bơm: " + (activeChannels().map(c => `${c.ch} = ${c.name || "chưa đặt tên"} (${ROLES[c.role]}${c.role === "fixed" ? " " + c.pct + "%" : ""}${c.role === "phbottle" ? " pH " + c.ph : ""})`).join(", ") || "chưa khai báo") + ".");
  if (phFactor()) L.push(`Bố trí pH: ${PH_MODES[phModeEff()]}; hệ đệm ${P.phCfg.buffer || "chưa chọn"}, pKa ${P.phCfg.pKa || b.bufferPka || "?"}, ${P.phCfg.targetMM} mM.`);
  L.push(`Pha nước và hệ đệm: pH pha nước ${b.ph || "chưa nhập"}; đệm hoặc phụ gia ${b.buffer || "chưa nhập"}; pKa đệm ${b.bufferPka || "chưa nhập"}; nồng độ ${b.bufferMM || "chưa nhập"} mM.`);
  L.push(`Cột: ${b.column || "chưa nhập"}, ${b.L}×${b.d} mm, ${b.dp} µm; khoảng pH cột ${b.colPhMin}–${b.colPhMax}; nhiệt độ tối đa ${b.colTmax} °C; áp suất tối đa hệ thống ${b.pmax} bar.`);
  L.push("Chất phân tích và pKa: " + (P.analytes.map(a => `${a.name} (pKa ${a.pka || "?"}; ${a.note || ""})`).join("; ") || "chưa nhập") + ".");
  return L.join("\n");
}
runSelfTest();
init();
renderAll();
