<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design-Expert Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: brand bar on top, step rail on the left, working canvas in the middle, AI drawer on the right. */
:root{
  --navy:#003A4F; --navy2:#0b5470; --gold:#CDC717; --bg:#F8F9FA; --surface:#FFFFFF; --ink:#16252B; --muted:#5B6B72;
  --guidebg:#f6f5d6; --guideline:#e6e39a; --guideink:#14232b;
  --line:#E2E8F0; --tint:#E6F0F4; --zebra:#F8F9FA; --input:#FCFBE6;
  --ok:#1E7B45; --okbg:#E3F3E9; --warn:#9A6400; --warnbg:#FFF3D6; --bad:#C00000; --badbg:#FDE6E6; --ai:#0070C0; --aibg:#E7F1FA;
  --font:"Arimo", "Liberation Sans", Arial, sans-serif; --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --navy:#7FC3DB; --navy2:#A5D8EA; --gold:#D9D33A; --bg:#0E171B; --surface:#152227; --ink:#E4ECEF; --muted:#9AAEB6;
  --guidebg:#25260F; --guideline:#4D4B1C; --guideink:#E4ECEF;
  --line:#2A3B42; --tint:#1B2E35; --zebra:#182930; --input:#2A2A16;
  --ok:#5CCB8A; --okbg:#173326; --warn:#E3B04B; --warnbg:#33290F; --bad:#FF7B7B; --badbg:#3A1919; --ai:#6CB7F0; --aibg:#14293A; color-scheme:dark; } }
:root[data-theme="dark"]{
  --navy:#7FC3DB; --navy2:#A5D8EA; --gold:#D9D33A; --bg:#0E171B; --surface:#152227; --ink:#E4ECEF; --muted:#9AAEB6;
  --guidebg:#25260F; --guideline:#4D4B1C; --guideink:#E4ECEF;
  --line:#2A3B42; --tint:#1B2E35; --zebra:#182930; --input:#2A2A16;
  --ok:#5CCB8A; --okbg:#173326; --warn:#E3B04B; --warnbg:#33290F; --bad:#FF7B7B; --badbg:#3A1919; --ai:#6CB7F0; --aibg:#14293A; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
.guide{background:var(--guidebg);border:1px solid var(--guideline);border-left:4px solid var(--gold);color:var(--guideink);border-radius:6px;padding:10px 14px;margin-bottom:16px}
.guide summary{font-weight:700;color:var(--navy);cursor:pointer}
.guide ol{margin:8px 0 2px 20px;padding:0;display:grid;gap:5px;text-align:justify}
.imp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--navy);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.imp b{color:var(--navy)}
.imp2{background:var(--surface);border:1px dashed var(--navy);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.imp2 b{color:var(--navy)}
.dxf{margin-top:8px}
.dxf>summary{cursor:pointer;font-size:0.8125rem;font-weight:600;color:var(--navy)}
.dxf table.fx td{text-align:left;vertical-align:top;font-size:0.7812rem;line-height:1.45;padding:6px 8px}
.dxo{margin:8px 0 0 18px;padding:0;font-size:0.7812rem;color:var(--muted);display:grid;gap:2px}
.fchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:1px solid var(--line);background:var(--tint);border-radius:14px;padding:2px 4px 2px 10px;font-size:0.7812rem;overflow-wrap:anywhere}
.xbtn{flex:none;width:1.25rem;height:1.25rem;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1rem;line-height:1;cursor:pointer;display:inline-grid;place-items:center;padding:0}
.xbtn:hover,.xbtn:focus-visible{background:var(--badbg);color:var(--bad)}
.tname{display:flex;align-items:center;gap:4px;font-size:0.6875rem;color:var(--muted);min-width:0}
.tname>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbx{background:var(--guidebg);border:1px solid var(--guideline);border-radius:5px;padding:6px 10px;margin:6px 0 2px 18px;font-size:0.7969rem;line-height:1.5;text-align:justify;color:var(--guideink)}
.flexw{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.flexw>.tw{min-width:0}
.kb{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:6px;padding:10px 14px;margin-bottom:16px}
.kb summary{font-weight:700;color:var(--navy);cursor:pointer}
.kb h4{margin:10px 0 4px;font-size:0.8125rem;color:var(--navy)}
.kb ul{margin:0 0 0 18px;padding:0;display:grid;gap:3px;text-align:justify;font-size:0.8125rem}
.just{white-space:pre-wrap;background:var(--zebra);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:0.8125rem}
.next{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--okbg);border:1px solid var(--ok);border-radius:8px;padding:8px 14px;margin-bottom:14px;font-size:0.8125rem}
.vh{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
body.drag main{outline:3px dashed var(--gold);outline-offset:-8px}
.gtab{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.gtab table{font-size:0.75rem}
details.card>summary{list-style:revert}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:0.875rem/1.5 var(--font);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);height:100%}
.bar>*{min-width:0}
.bar{background:#003A4F;color:#fff;border-bottom:4px solid #CDC717}
.bar1{display:flex;align-items:center;gap:14px;padding:8px 22px;flex-wrap:nowrap;overflow:hidden}
.bar1>*{min-width:0}
.bar2{display:flex;flex-wrap:wrap;align-items:stretch;background:#07475E;border-top:1px solid rgba(255,255,255,.14);padding:0 22px}
.tg{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 18px;border-right:1px solid rgba(255,255,255,.16);min-width:0}
.bar .btn,.bar label.btn{flex:none;white-space:nowrap}
.bar select{min-width:0;flex:0 1 auto}
.tg:first-child{padding-left:0}
.tg:last-child{border-right:0}
.bar .tgl{font-size:0.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.72;margin-right:4px;white-space:nowrap}
.bar label.btn{opacity:1;margin-right:0;font-size:0.75rem}
.bar2 select{max-width:280px}
.bar .stella-logo{height:34px;width:auto;color:#fff;flex:none;display:block}
.bar .hdiv{width:1px;height:34px;background:rgba(255,255,255,.28);flex:none}
.brand{display:flex;flex-direction:column;line-height:1.15;flex:none;white-space:nowrap}
.brand b{font-size:1.125rem;letter-spacing:.2px}
.brand small{font-size:0.75rem;opacity:.85}
.bar .grow{flex:1}
.bar select,.bar .btn{background:#0B4F66;border:1px solid #2F6E83;color:#fff}
.bar select{width:auto;max-width:320px}
.aigrp{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.bar .btn.aibtn{background:#CDC717;border-color:#CDC717;color:#003A4F;font-weight:700}
.bar .row{flex-wrap:nowrap}
.bar label{font-size:0.75rem;opacity:.85;margin-right:6px}
.savestate{font-size:0.75rem;opacity:.85;text-align:right;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.bar.compact .bar1{flex-wrap:wrap;overflow:visible}.bar.compact .brand small,.bar.compact .hdiv,.bar.compact .tgl{display:none}.bar.compact .brand{white-space:normal;flex:1 1 auto}.bar.compact .tg{display:contents}.bar.compact .bar2{gap:6px;padding:8px 12px}.bar.compact .savestate{flex:1 1 100%;text-align:left;white-space:normal}.bar.compact #projSel{flex:1 1 100%;max-width:none}
.zoomctl{display:flex;gap:4px;flex-wrap:nowrap}
.zoomctl .btn{min-width:2.6rem;justify-content:center}
#zoomVal{min-width:3.6rem}

.body{display:grid;grid-template-columns:14.5rem minmax(0,1fr);min-height:0}
.body.ai-open{grid-template-columns:14.5rem minmax(0,1fr) 24rem}
.rail{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:12px 8px}
.rail button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer}
.rail button:hover{background:var(--tint)}
.rail button.on{background:var(--input);box-shadow:inset 4px 0 0 var(--gold)}
.rail .n{flex:none;width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:0.75rem;background:var(--line);color:var(--ink)}
.rail .n.ok{background:var(--ok);color:var(--surface)}.rail .n.warn{background:var(--warn);color:var(--surface)}.rail .n.bad{background:var(--bad);color:var(--surface)}
.rail .t{font-weight:600;font-size:0.8125rem}.rail .s{font-size:0.7188rem;color:var(--muted)}
.rail hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
.rail button.kbtab{align-items:center;background:linear-gradient(135deg,var(--input),var(--tint));border:1px solid var(--gold);border-radius:10px;padding:10px}
.rail button.kbtab:hover{box-shadow:0 2px 8px rgba(0,58,79,.18)}
.kbi{flex:none;width:2.25rem;height:2.25rem;border-radius:10px;display:inline-grid;place-items:center;background:#003A4F;color:#CDC717}
.kbi.sm{width:1.5rem;height:1.5rem;border-radius:6px;margin-right:8px;vertical-align:middle}.kbi.sm svg{width:15px;height:15px}
.kbgo{display:block;margin-top:3px;font-size:0.7188rem;font-weight:700;color:var(--navy)}
.legend{font-size:0.7188rem;color:var(--muted);padding:4px 10px;display:grid;gap:4px}

main{overflow:auto;padding:22px 26px 60px;min-width:0}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:1.375rem;color:var(--navy)}
.head p{margin:2px 0 0;color:var(--muted);text-align:justify}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:0.875rem;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.2px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
.card h2 .btn,.card h2 label.btn,.card h2 .fld,.card h2 select{text-transform:none;letter-spacing:0}
.card h2 .hint{text-transform:none;letter-spacing:0;font-weight:400}
.card h2 .sp{flex:1}
.hint{text-align:justify;color:var(--muted);font-size:0.7812rem;margin:4px 0 10px;}
.grid{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.fld{display:flex;flex-direction:column;gap:3px}
.fc{display:flex;flex-direction:column;gap:3px;min-width:0}
@supports (grid-template-rows:subgrid){.grid>.fld{display:grid;grid-template-rows:subgrid;grid-row:span 2;row-gap:3px}.grid>.fld>.fl{align-self:end}.grid>.fld>.fc{align-self:start}}
.fc>input,.fc>select,.fc>textarea.ag{min-height:2.2rem}
input[type=datetime-local]{background:var(--input);border:1px solid var(--line);border-radius:5px;padding:5px 8px;min-width:0;width:100%;color:inherit;font:inherit}
.fld label{font-size:0.75rem;color:var(--muted)}
.fl{display:flex;align-items:center;gap:5px;min-height:1.15rem}
.hbtn{flex:none;width:1.05rem;height:1.05rem;border-radius:50%;border:1px solid var(--muted);background:transparent;color:var(--muted);font-size:0.6562rem;font-weight:700;line-height:1;padding:0;cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle;text-transform:none}
.hbtn:hover,.hbtn:focus-visible,.hbtn[aria-expanded=true]{border-color:var(--navy);color:var(--navy)}
.hbtn[aria-expanded=true]{background:var(--navy);color:var(--surface)}
.pop{position:fixed;z-index:90;width:min(22.5rem,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:var(--surface);border:1px solid var(--navy);border-left:4px solid var(--gold);border-radius:8px;padding:0.6rem 2rem 0.6rem 0.75rem;box-shadow:0 8px 24px rgba(0,30,42,.28);font-size:0.8125rem;line-height:1.5;text-align:left;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink)}
.pop b{color:var(--navy)}
.pop-x{position:absolute;top:2px;right:4px;border:0;background:none;font-size:1.25rem;line-height:1;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px}
.pop-x:hover,.pop-x:focus-visible{color:var(--navy)}
th:has(>.hbtn){padding-left:1.5rem;padding-right:1.5rem}
th>.hbtn{border-color:#fff;color:#fff;position:absolute;right:0.3rem;top:50%;transform:translateY(-50%);margin:0}
th .hbtn:hover,th .hbtn:focus-visible{border-color:#CDC717;color:#CDC717}
th .hbtn[aria-expanded=true]{background:#CDC717;border-color:#CDC717;color:#003A4F}
.fld input:disabled{background:var(--tint);color:var(--muted);font-style:italic;opacity:1}
.ver{font-size:0.6875rem;font-weight:400;border:1px solid rgba(255,255,255,.45);border-radius:10px;padding:1px 8px;margin-left:8px;white-space:nowrap;vertical-align:middle}
input[type=text],input[type=number],select,textarea{background:var(--input);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0;width:100%}
textarea{font-family:var(--mono);font-size:0.7812rem;min-height:110px;resize:vertical}
textarea.ag{font-family:var(--font);font-size:0.8438rem;line-height:1.4;min-height:0;resize:none;overflow-y:hidden;white-space:pre-wrap;overflow-wrap:anywhere;display:block}
td select:not([style]){width:auto;min-width:100%}
td textarea.ag{min-width:7.5rem}
sub,sup{font-size:.72em;line-height:0}
.sym{text-transform:none;letter-spacing:0}
.tw{max-width:100%;-webkit-overflow-scrolling:touch}
.tw::-webkit-scrollbar,textarea.ag::-webkit-scrollbar{height:10px;width:8px}
.tw::-webkit-scrollbar-thumb,textarea.ag::-webkit-scrollbar-thumb{background:#9FB3BD;border-radius:6px}
.next.warn{background:var(--warnbg);border-color:var(--warn)}
details.card>summary{cursor:pointer}
td input,td select{padding:4px 6px;border-radius:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:0.8125rem;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.btn.pri:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#003A4F}
.btn.ai{background:var(--aibg);border-color:var(--ai);color:var(--ai)}
.btn.sm{padding:3px 8px;font-size:0.75rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tier{font-size:0.6562rem;font-weight:700;border-radius:10px;padding:1px 7px;margin-left:6px;border:1px solid currentColor}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:0.8125rem}
th{background:#003A4F;color:#fff;font-weight:600;font-size:0.75rem;text-align:center;padding:6px 8px;border-bottom:3px solid #CDC717;white-space:nowrap;position:sticky;top:0}
td{border-top:1px solid var(--line);padding:4px 8px;text-align:center}
tbody tr:nth-child(even) td{background:var(--zebra)}
td.l{text-align:left}
th.l{text-align:center}
.wrapth th{white-space:normal}
table.fx{table-layout:fixed}
table.fx th{white-space:normal;vertical-align:middle;overflow-wrap:normal;word-break:normal;hyphens:none;line-height:1.3}
table.fx td{overflow-wrap:break-word;vertical-align:middle}
table.fx td>input,table.fx td>select,table.fx td>textarea,table.fx td>select:not([style]){width:100%!important;min-width:0!important}
table.fx .rng input{min-width:0!important}
input[data-fit]{text-overflow:ellipsis}
td input[data-fit]{font-size:0.7812rem;padding:4px 5px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rng{display:flex;align-items:center;gap:4px}.rng input{flex:1 1 0;width:auto}
.st{font-weight:700}.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}
tr.st-ok td{background:var(--okbg)!important}tr.st-warn td{background:var(--warnbg)!important}tr.st-bad td{background:var(--badbg)!important}
.lg{display:inline-block;width:0.75rem;height:0.75rem;border-radius:3px;vertical-align:-1px;border:1px solid}.lg.ok{background:var(--okbg);border-color:var(--ok)}.lg.warn{background:var(--warnbg);border-color:var(--warn)}.lg.bad{background:var(--badbg);border-color:var(--bad)}
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:10px 16px}.sg{display:flex;flex-direction:column;gap:6px}
main .btn,.drawer .btn,.modal .btn{white-space:normal;max-width:100%}
main .row>*,main .grid>*{min-width:0}
.credit{margin:18px 0 4px;text-align:center;font-size:0.6875rem;color:var(--muted);line-height:1.5}
.aisum{background:var(--surface);border:1px solid var(--ai);border-left:4px solid var(--ai);border-radius:6px;padding:8px 12px;margin:2px 0 10px}.aisum>b{display:block;color:var(--ai);margin-bottom:4px}.aisum p,.aisum li{text-align:left}.aisum ul,.aisum ol{margin:0 0 0 18px;padding:0}.aisum p{margin:0 0 4px}
.kbt>summary{list-style:none;cursor:pointer;font-weight:700;color:var(--navy);padding:5px 0;font-size:0.8438rem}.kbt>summary::-webkit-details-marker{display:none}
.kbt>summary::before{content:"▶";display:inline-block;width:1.3em;font-size:0.75em;color:var(--navy)}.kbt[open]>summary::before{content:"▼"}
.kbt[open]{padding-bottom:8px}.kb>.kbt+.kbt{border-top:1px solid var(--line)}
th .xbtn{color:#fff;vertical-align:middle}th .xbtn.arm{width:auto;border-radius:10px;background:var(--bad);color:#fff;font-size:0.6875rem;font-weight:700;padding:0 8px}
td.id{font-weight:700}
td.na{background:var(--badbg)!important;color:var(--bad)}
td.ign{background:var(--tint)!important;color:var(--muted);font-style:italic}
td.hl{color:var(--bad);font-weight:700}
.mono{font-family:var(--mono)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:0.7188rem;font-weight:700;border-radius:10px;padding:1px 8px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--tint);color:var(--navy)}
.flags{display:grid;gap:6px;margin:8px 0}
.flag{border-left:4px solid;padding:6px 10px;border-radius:0 6px 6px 0;font-size:0.8125rem}
.flag.bad{border-color:var(--bad);background:var(--badbg)}.flag.warn{border-color:var(--warn);background:var(--warnbg)}.flag.ok{border-color:var(--ok);background:var(--okbg)}.flag.info{border-color:var(--navy);background:var(--tint)}
.aiout{border:1px solid var(--ai);background:var(--aibg);border-radius:6px;padding:10px 12px;font-size:0.8125rem;margin-top:8px;max-height:520px;overflow:auto}
.md p{margin:0 0 6px;text-align:justify}.md p.mdh{font-weight:700;color:var(--navy);margin-top:8px}.md ul,.md ol{margin:0 0 6px 20px;padding:0}.md li{margin:2px 0;text-align:justify}.md code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.92em;background:var(--tint);padding:0 3px;border-radius:3px}
.md table.mdt{width:100%;margin:4px 0 8px}.md table.mdt td{vertical-align:top}
.md>:last-child{margin-bottom:0}
.fuq{margin:10px 0 6px;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.fu{display:flex;gap:8px;align-items:flex-end;margin-top:10px}.fu textarea{flex:1;min-width:0;background:var(--surface)}
.grid+.flag,.grid+.flags{margin-top:12px}
.flow{display:grid;margin:8px 0 6px 18px;font-size:0.7969rem;line-height:1.45}
.frow{display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.fnode{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface);color:var(--ink)}
.fnode.start{border-color:var(--navy);border-left:4px solid var(--navy);font-weight:600}
.fnode.dec{border-color:var(--warn);background:var(--warnbg);border-radius:14px}
.fnode.side{border-color:var(--ok);background:var(--okbg)}
.fnode.end{border-color:var(--ok);background:var(--okbg);border-left:4px solid var(--ok)}
.flab{display:flex;align-items:center;gap:6px;color:var(--navy);white-space:nowrap}
.fdown{display:flex;align-items:center;gap:8px;color:var(--navy);padding:3px 0 3px 2.2rem}
.farr{flex:none;display:block}
.fpill{font-size:0.75rem;font-weight:700;color:var(--navy);background:var(--surface);border:1.5px solid var(--navy);border-radius:999px;padding:1px 10px;white-space:nowrap}
@media (max-width:700px){.frow{grid-template-columns:1fr;gap:4px}.flab{padding-left:2.2rem}.flab .farr{transform:rotate(90deg)}.fnode.side{margin-left:1.4rem}.flow{margin-left:0}.fpill{white-space:normal}}
.aiout .tag{color:var(--ai);font-weight:700;font-size:0.7188rem;display:block;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:12px;align-items:start}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
td.calc input{font-style:italic;color:var(--navy);background:var(--guidebg)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface)}
.thumb img{width:100%;height:130px;object-fit:contain;background:#fff;border-radius:6px}
.thumb input[type=text]{width:100%;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:1.25rem;color:var(--navy)}
.kpi span{font-size:0.7188rem;color:var(--muted);text-transform:uppercase;letter-spacing:.2px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px}
.mcard{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface)}
.mcard h3{font-size:0.875rem;margin:-12px -12px 10px;padding:8px 12px;border-radius:8px 8px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--tint);color:var(--navy)}
.mcard.st-ok{border-color:var(--ok)}.mcard.st-ok h3{background:var(--okbg);color:var(--ok)}
.mcard.st-warn{border-color:var(--warn)}.mcard.st-warn h3{background:var(--warnbg);color:var(--warn)}
.mcard.st-bad{border-color:var(--bad)}.mcard.st-bad h3{background:var(--badbg);color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--muted);text-align:center}
.notice{background:var(--warnbg);color:var(--warn);padding:8px 14px;font-size:0.8125rem;border-bottom:1px solid var(--line)}

.drawer{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.drawer header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.drawer header b{flex:1;color:var(--navy)}
.msgs{flex:1;overflow:auto;padding:12px;display:grid;gap:10px;align-content:start}
.msg{padding:8px 10px;border-radius:8px;font-size:0.8125rem}
.msg.u{white-space:pre-wrap}
.msg.a p{margin:0 0 6px}.msg.a ul,.msg.a ol{margin:0 0 6px 18px;padding:0}.msg.a>:last-child{margin-bottom:0}.msg.a p.mdh{font-weight:700}
.msg.u{background:var(--tint);justify-self:end;max-width:92%}
.msg.a{background:var(--aibg);border:1px solid var(--ai)}
.drawer form{border-top:1px solid var(--line);padding:10px;display:grid;gap:6px}
.drawer textarea{min-height:70px;font-family:var(--font);font-size:0.8125rem}
.modal{position:fixed;inset:0;background:rgba(0,20,28,.45);display:grid;place-items:center;z-index:9;padding:16px}
.modal .box{background:var(--surface);border-radius:8px;max-width:900px;width:100%;max-height:85vh;overflow:auto;padding:16px}

@media (max-width:980px){
  .app{height:auto;min-height:100%}
  .body,.body.ai-open{grid-template-columns:minmax(0,1fr)}
  .rail{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;position:sticky;top:0;z-index:5}
  .rail button{width:auto;flex:none;padding:6px 8px}.rail .s,.rail hr,.legend,.kbgo{display:none}.rail button.kbtab{padding:5px 8px}.rail .kbtab .kbi{width:1.5rem;height:1.5rem;border-radius:6px}.rail .kbtab .kbi svg{width:15px;height:15px}.rail .t{white-space:nowrap;font-size:0.7812rem}
  .drawer{position:fixed;inset:auto 0 0 0;height:70%;z-index:8}
  main{padding:14px 12px 60px;overflow:visible}
  .bar1{padding:8px 12px;gap:8px;flex-wrap:wrap;overflow:visible}
  .bar .stella-logo{height:24px}.bar .hdiv,.brand small{display:none}
  .brand b{font-size:1rem}
  .savestate{font-size:0.6875rem;white-space:normal}
  .bar1 .grow{display:none}.savestate{flex:1 1 100%;order:9;text-align:left}
  .bar2{padding:8px 12px;gap:6px}
  .tg{display:contents}.bar .tgl{display:none}
  .bar #projSel{flex:1 1 100%;max-width:none;min-width:0}
  .bar2>*{max-width:100%}
  .head h1{font-size:1.1875rem}
  .card{padding:12px;border-radius:10px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi b{font-size:1.0625rem}
  .next{padding:8px 10px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr))}
}
@media (pointer:coarse){input[type=text],input[type=number],input[type=datetime-local],select,textarea{font-size:max(16px,1rem)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

 {id:"design", t:"Lựa chọn kiểu thiết kế: CCD, FCD hoặc BBD", s:["risk","translate"], b:[

  "Các đồ thị Contour và 3D Surface của sai số chuẩn thường có dạng lòng chảo: sai số nhỏ nhất ở tâm và lớn nhất ở các góc. Vì vậy, dự đoán của mô hình tại các góc của vùng khảo sát kém chính xác hơn tại tâm, và điểm cài đặt nên nằm xa các góc.",
  "Không dùng mô hình để dự đoán tại các giá trị nằm ngoài vùng khảo sát; phần mềm hiển thị cảnh báo “Factor value outside of design space” trong trường hợp này."],
  x:["Với đáp ứng Rs, nhập d = 0,5 (chênh lệch Rs cần phát hiện) và s = 0,15 (độ lệch chuẩn của Rs giữa các lần pha lặp lại). Nếu đồ thị FDS cho giá trị 0,92, thiết kế đủ khả năng phát hiện chênh lệch 0,5 đơn vị Rs trên 92% vùng khảo sát và có thể tiến hành thực nghiệm."]},
 {id:"factors", t:"Lựa chọn yếu tố và đáp ứng", s:["project","risk"], b:[
  "Ưu tiên các yếu tố làm thay đổi độ chọn lọc α, không chỉ thay đổi thời gian lưu: % dung môi hữu cơ, pH của pha nước khi có chất phân tích ion hóa, và nhiệt độ cột.",
  "Với rửa giải gradient, các yếu tố thường khảo sát gồm % hữu cơ ban đầu, thời gian gradient (hoặc độ dốc) và thời gian giữ đẳng dòng ban đầu. % hữu cơ ban đầu quyết định khả năng hội tụ dải chất ở đầu cột; thời gian giữ đẳng dòng ban đầu giúp tách các tạp phân cực khỏi pic dung môi và bù trừ khác biệt về thể tích trễ (dwell volume) giữa các thiết bị.",
  "Tốc độ dòng và nồng độ đệm thường được giữ cố định hoặc khảo sát trong khoảng hẹp. Cần lưu ý: trong rửa giải đẳng dòng, tốc độ dòng gần như không ảnh hưởng đến độ chọn lọc; trong rửa giải gradient, thay đổi tốc độ dòng làm thay đổi k* và có thể thay đổi độ chọn lọc.",
  "Bộ đáp ứng nên bao gồm: Rs của cặp pic khó tách nhất hoặc Rs nhỏ nhất của toàn sắc ký đồ; tR của pic cuối cùng, đại diện cho thời gian phân tích; As hoặc Tf của pic chính; N của pic rửa giải sớm nhất để kiểm soát hiệu ứng dung môi; α của cặp khó tách; và áp suất tối đa để bảo vệ hệ thống.",
  "Số yếu tố nên giới hạn ở 3–4. Mỗi yếu tố bổ sung làm tăng đáng kể số Run và số phương pháp thực chạy phải cân bằng cột."],
  x:["Phương pháp gradient xác định tạp chất liên quan: yếu tố A là % acetonitril ban đầu (5–15%), yếu tố B là thời gian gradient (20–40 phút), yếu tố C là nhiệt độ cột (30–40 °C). Đáp ứng: Rs của cặp tạp chất khó tách (tiêu chí ≥ 2,0), tR của pic cuối cùng (càng ngắn càng tốt), N của pic rửa giải sớm nhất (tiêu chí ≥ 2000)."]},
 {id:"scout", t:"Thực nghiệm thăm dò tại các điểm góc trước khi chạy ma trận", s:["translate","sequence"], b:[
  "Mô hình bề mặt đáp ứng chỉ nội suy trong vùng khảo sát. Nếu kết quả tại các điểm góc không đo được hoặc không tích phân được, toàn bộ mô hình mất giá trị. Vì vậy, cần thực nghiệm thăm dò tại ít nhất hai điểm góc trước khi chạy ma trận: điểm có khả năng lưu giữ mạnh nhất và điểm có khả năng lưu giữ yếu nhất.",
  "Kết quả được xem là đạt khi: tất cả các pic rửa giải trong thời gian chấp nhận được; pic đầu tiên có k ≥ 1; nhận diện được từng pic kể cả khi chập hoặc đảo thứ tự (bằng phổ UV, khối phổ hoặc tiêm chuẩn đơn); Tf < 2,5 và pic tích phân được. Không yêu cầu các pic tách hoàn toàn tại mọi điểm góc.",
  "Cần dừng và điều chỉnh khoảng khảo sát khi: mất pic (chất không rửa giải hoặc rửa giải tại thời gian chết); pic tách đôi, có vai hoặc Tf > 3; quá áp; kết tủa muối đệm.",
  "Các hướng xử lý: tịnh tiến khoảng khảo sát khi tất cả các pic đều rửa giải quá sớm hoặc quá muộn; thu hẹp khoảng khi điểm tâm cho kết quả tốt nhưng các điểm góc không đạt; điều chỉnh dung môi pha mẫu khi chỉ pic đầu tiên bị biến dạng; thay cột hoặc dung môi hữu cơ khi α xấp xỉ 1 trên toàn vùng khảo sát."],
  x:["Khảo sát % methanol 20–40% và nhiệt độ cột 25–45 °C, thời gian chết t0 = 1,5 phút. Điểm lưu giữ mạnh nhất là 20% methanol tại 25 °C: cần kiểm tra pic cuối cùng có rửa giải trước 60 phút và áp suất có dưới giới hạn. Điểm lưu giữ yếu nhất là 40% methanol tại 45 °C: pic đầu tiên cần có tR ≥ 3,0 phút, tương ứng k ≥ 1.",
     "Nếu tại 20% methanol pic cuối cùng rửa giải ở phút 95, tịnh tiến khoảng khảo sát thành 30–50% methanol và thăm dò lại, thay vì giữ nguyên khoảng và kéo dài thời gian chạy."]},
 {id:"center", t:"Điểm tâm", s:["risk","sequence"], b:[
  "Điểm tâm có bốn vai trò: cung cấp ước lượng sai số thuần (pure error) để kiểm định Lack of Fit; giữ phương sai dự đoán thấp ở vùng trung tâm, là nơi thường chứa điểm tối ưu; cung cấp bậc tự do cho phần dư; và cho phép phát hiện độ trôi của hệ thống theo thời gian.",
  "Không thiết kế với 0 hoặc 1 điểm tâm. Số điểm tâm tối thiểu là 3; giá trị mặc định của phần mềm là 5–6. Với thiết kế Box-Behnken, khi không có điểm tâm, các số hạng bậc hai không ước lượng được.",
  "Các điểm tâm được phân bố ở đầu, giữa và cuối dãy theo thứ tự ngẫu nhiên của Design-Expert. So sánh kết quả của điểm tâm đầu tiên và điểm tâm cuối cùng cho biết hệ thống có bị trôi hay không (cột nhiễm bẩn, pha động bay hơi, nhiệt độ phòng thay đổi).",
  "Mỗi điểm tâm cần được pha mẫu độc lập trong bình định mức riêng và tiêm từ lọ riêng. Nếu tiêm lặp lại từ cùng một lọ, sai số thuần chỉ phản ánh độ lặp lại của bộ tiêm mẫu, nhỏ hơn nhiều so với sai số thực của quy trình, và làm cho Lack of Fit có ý nghĩa thống kê một cách giả tạo."],
  x:["Ma trận FCD 20 Run có 6 điểm tâm tại các Run 3, 7, 10, 14, 17 và 20. Rs của cặp khó tách tại các điểm tâm lần lượt là 2,31; 2,28; 2,35; 2,30; 2,26; 2,33: các giá trị dao động ngẫu nhiên, hệ thống ổn định. Nếu các giá trị là 2,35; 2,31; 2,24; 2,18; 2,12; 2,05, Rs giảm đều theo thứ tự Run: hệ thống bị trôi và cần tìm nguyên nhân trước khi phân tích mô hình."]},
 {id:"coel", t:"Xử lý chập pic và đảo thứ tự rửa giải", s:["results"], b:[
  "Khi vùng khảo sát rộng, hai pic có thể chập hoàn toàn tại một số Run hoặc đảo thứ tự rửa giải. Khi đó Rs của một cặp pic cố định không còn xác định liên tục và cần chọn lại đáp ứng.",
  "Các đáp ứng thay thế: Rs nhỏ nhất của toàn sắc ký đồ (không cần biết cặp nào đang là cặp khó tách); số pic tách được; hoặc tR của từng chất, là hàm liên tục theo các yếu tố và được mô hình hóa tốt nhất.",
  "Khi hai pic chập hoàn toàn, gán Rs = 0. Giá trị 0 tạo ra vùng bất lợi trên bề mặt đáp ứng để quá trình tối ưu hóa tránh vùng này. Nếu để trống, phần mềm nội suy từ các Run lân cận và có thể đề xuất điểm tối ưu ngay tại vùng chập pic.",
  "Khi hai pic đảo thứ tự, nhập giá trị tuyệt đối của Rs và ghi chú thứ tự rửa giải của Run đó.",
  "Khi dùng độ chọn lọc làm đáp ứng trong trường hợp có đảo thứ tự, dùng α* = α nếu α ≥ 1 và α* = 1/α nếu α < 1, hoặc dùng |ΔtR|, với mục tiêu Maximize. Hai đại lượng này luôn dương và đạt giá trị nhỏ nhất (α* = 1; |ΔtR| = 0) tại điểm chập pic. Ứng dụng tính các đáp ứng thứ cấp này ở bước 5.",
  "Khi pic tạp nhỏ nằm sát pic chính lớn và CDS báo n.a. cho Rs, tiêm riêng dung dịch của từng chất để xác định tR, sau đó dùng α* hoặc |ΔtR|.",
  "Lưu ý: |Rs|, α* và |ΔtR| đổi chiều đột ngột tại điểm hai pic giao nhau, trong khi mô hình đa thức bậc hai là đường cong trơn. Sai số dự đoán của mô hình lớn nhất ở lân cận điểm giao nhau; điểm cài đặt nên nằm xa vùng này."],
  x:["Thời gian chết t0 = 1,50 phút. Tại Run 3: tR của tạp chất A là 6,20 phút và của hoạt chất là 6,55 phút, nên k lần lượt là 3,13 và 3,37; α = 3,37/3,13 = 1,08; ΔtR = 0,35 phút. Tại Run 9, thứ tự đảo lại: tR của tạp chất A là 7,10 phút và của hoạt chất là 6,80 phút, nên k lần lượt là 3,73 và 3,53; α tính theo cùng thứ tự = 3,53/3,73 = 0,95. Giá trị nhập vào Design-Expert: α* = 1/0,95 = 1,06 hoặc |ΔtR| = 0,30 phút."]},
 {id:"select", t:"Lựa chọn mô hình tự động", s:["models"], b:[
  "Chức năng Auto Select tại mục Model loại bỏ các số hạng không cần thiết khỏi mô hình đầy đủ. Cần chọn tiêu chí (Criterion) và hướng chọn (Selection).",
  "Các tiêu chí: giá trị p giữ lại các số hạng có p nhỏ hơn ngưỡng đã đặt; AICc cân bằng giữa độ khớp và độ phức tạp của mô hình, có hiệu chỉnh cho thiết kế nhỏ, mô hình có AICc thấp nhất được chọn; BIC tương tự AICc và phù hợp hơn với thiết kế lớn.",
  "Các hướng chọn: Forward bắt đầu từ mô hình chỉ có hệ số chặn và thêm dần từng số hạng; Backward bắt đầu từ mô hình đầy đủ và loại dần từng số hạng; Stepwise thêm từng số hạng và sau mỗi bước kiểm tra lại các số hạng đã có.",
  "Sổ tay của nhóm khuyến nghị dùng AICc với hướng Backward: quá trình bắt đầu từ mô hình đầy đủ nên không bỏ sót số hạng tương tác có ý nghĩa của một yếu tố mà tác động bậc nhất yếu. Tài liệu của Stat-Ease cho rằng với phần lớn thiết kế, AICc với hướng Forward hoặc giá trị p với hướng Backward cho kết quả tốt, và khuyên thử nhiều tổ hợp rồi so sánh.",
  "Nguyên tắc phân cấp (hierarchy): khi số hạng tương tác AB hoặc số hạng bậc hai A² được giữ lại, các số hạng bậc nhất A và B cũng phải có mặt trong mô hình, kể cả khi giá trị p của chúng lớn.",
  "Sau khi phần mềm chọn mô hình, cần rà soát phương trình theo cơ sở hóa lý (dấu và độ lớn của từng hệ số) và xem lại ANOVA, Diagnostics trước khi chấp nhận. Chức năng tự động không thay thế đánh giá của người phân tích."],
  x:["Đáp ứng Rs với 3 yếu tố A (% methanol), B (pH của pha nước) và C (nhiệt độ cột). Nhật ký Backward Elimination ghi: mô hình bậc nhất đầy đủ có AICc = 41,2; loại C cho AICc = 37,8; sau đó loại thêm A hoặc B đều làm AICc tăng (58,9 và 52,3), nên quá trình dừng lại. Mô hình cuối cùng là Rs = +3,10 + 1,45A − 0,82B: nhiệt độ cột không ảnh hưởng có ý nghĩa đến Rs trong khoảng khảo sát."]},
 {id:"adeq", t:"Adeq Precision và độ lệch chuẩn của mô hình", s:["models"], b:[
  "Adeq Precision là tỷ số tín hiệu trên nhiễu của mô hình: khoảng biến thiên của các giá trị dự đoán tại các điểm thiết kế chia cho sai số dự đoán trung bình. Giá trị lớn hơn 4 cho thấy mô hình đủ khả năng định hướng trong vùng khảo sát. Với HPLC, giá trị này thường đạt 15–30.",
  "Độ lệch chuẩn của mô hình (Std. Dev.) là phần biến thiên của đáp ứng chưa được mô hình giải thích, có cùng đơn vị với đáp ứng. Giá trị càng nhỏ, các điểm thực nghiệm càng gần bề mặt dự đoán.",
  "Hai chỉ số cần được xem cùng nhau: Adeq Precision thấp có thể do đáp ứng gần như không thay đổi trong vùng khảo sát (tín hiệu nhỏ) hoặc do thực nghiệm kém lặp lại (nhiễu lớn).",
  "Độ lệch chuẩn của mô hình cần được so sánh với dung sai có ý nghĩa kỹ thuật của đáp ứng, không chỉ đánh giá theo ý nghĩa thống kê."],
  x:["Trường hợp mô hình dùng được: khi thay đổi % dung môi hữu cơ và nhiệt độ cột, Rs thay đổi từ 1,2 đến 3,5 (khoảng biến thiên 2,3) và độ lệch chuẩn của mô hình là 0,1. Adeq Precision đạt khoảng 15–20.",
     "Trường hợp mô hình không dùng được: Rs chỉ dao động từ 1,5 đến 1,7 (khoảng biến thiên 0,2) trong khi độ lệch chuẩn của mô hình là 0,15. Adeq Precision nhỏ hơn 4: không phân biệt được thay đổi 0,1 đơn vị Rs là do yếu tố khảo sát hay do sai số ngẫu nhiên. Khi đó Rs của cặp pic này không nhạy với các yếu tố đã chọn và không nên dùng mô hình để tối ưu hóa."]},
 {id:"diag", t:"Đánh giá đồ thị Diagnostics và Influence", s:["models"], b:[
  "Nhóm Diagnostics kiểm tra các giả định thống kê của mô hình dựa trên phần dư của toàn bộ các Run; nhóm Influence tìm các Run riêng lẻ chi phối mô hình. Cần đánh giá nhóm Diagnostics trước.",
  "Normal Plot of Residuals: các điểm nằm gần một đường thẳng cho thấy phần dư phân bố chuẩn. Dạng chữ S hoặc đường cong rõ rệt gợi ý cần biến đổi đáp ứng.",
  "Residuals vs Predicted: các điểm cần phân bố ngẫu nhiên quanh 0. Dạng hình phễu (phần dư tăng dần theo giá trị dự đoán) cho thấy phương sai không đồng nhất và cần biến đổi đáp ứng.",
  "Residuals vs Run: xu hướng tăng dần, giảm dần hoặc theo chu kỳ cho thấy có yếu tố ngoài mô hình thay đổi theo thời gian, ví dụ cột nhiễm bẩn dần hoặc pha động bay hơi.",
  "Predicted vs Actual: các điểm càng gần đường chéo, mô hình dự đoán càng chính xác. Residuals vs từng yếu tố: dạng đường cong cho thấy mô hình thiếu số hạng bậc hai của yếu tố đó.",
  "Box-Cox: nếu khoảng tin cậy 95% của λ chứa giá trị hiện tại (λ = 1 khi chưa biến đổi), không cần biến đổi; nếu không, áp dụng phép biến đổi do phần mềm khuyến nghị. Phép biến đổi lũy thừa chỉ có tác dụng rõ khi tỷ số giữa giá trị lớn nhất và nhỏ nhất của đáp ứng lớn hơn 3; tỷ số lớn hơn 10 thường cần biến đổi.",
  "Nhóm Influence: Cook’s Distance đo mức thay đổi của toàn bộ mô hình khi loại một Run; Leverage đo ảnh hưởng do vị trí của Run trong vùng khảo sát, với giá trị trung bình bằng số số hạng của mô hình (kể cả hệ số chặn) chia cho số Run, và Run có Leverage lớn hơn 2 lần giá trị trung bình được xem là có đòn bẩy cao; DFFITS đo mức thay đổi của giá trị dự đoán tại chính Run đó; DFBETAS đo mức thay đổi của từng hệ số.",
  "Xử lý Run chi phối mô hình: kiểm tra lại dữ liệu thô và sắc ký đồ (tích phân, nhận diện pic); phân tích lại trên bản sao của tệp với Run đó đặt Ignore để so sánh; thực nghiệm lặp lại đúng điều kiện của Run đó. Nếu kết quả lặp lại vẫn như cũ, dữ liệu là thật và phải giữ lại.",
  "Không loại bỏ dữ liệu hợp lệ để cải thiện đồ thị. Với dữ liệu hợp lệ, xem xét biến đổi đáp ứng theo Box-Cox hoặc bổ sung số hạng bậc cao hơn. Nếu vẫn sai lệch, có thể tồn tại biến ẩn (lô pha động, người thực hiện, ngày thực nghiệm) hoặc cơ chế lưu giữ thay đổi trong vùng khảo sát; khi đó nên thu hẹp vùng khảo sát hoặc lập thiết kế mới quanh vùng bất thường."],
  x:["Đáp ứng Rs của một cặp pic thay đổi từ 0,5 đến 12 trong vùng khảo sát (tỷ số 24). Đồ thị Residuals vs Predicted có dạng hình phễu và Box-Cox khuyến nghị Log. Sau khi chọn Transform là Natural Log và phân tích lại, phần dư phân bố đều. Ngược lại, với đáp ứng α thay đổi từ 1,07 đến 1,22 (tỷ số 1,14), phép biến đổi lũy thừa gần như không có tác dụng dù đồ thị Box-Cox cho λ tối ưu khác 1.",
     "Mô hình Rs = b0 + b1A + b2B + b12AB có 4 số hạng kể cả hệ số chặn, phân tích trên 20 Run. Leverage trung bình là 4/20 = 0,20 và giới hạn là 0,40. Một Run có Cook’s Distance 0,62, cao hơn hẳn các Run còn lại nhưng dưới giới hạn 0,90: cần xem lại sắc ký đồ của Run này, không tự động loại bỏ."]},
 {id:"outflow", t:"Cây quyết định xử lý điểm dị biệt", s:["models"], b:[
  "Cây quyết định này áp dụng khi Diagnostics của Design-Expert đánh dấu một Run là điểm dị biệt: Externally Studentized Residuals, Cook’s Distance hoặc DFFITS vượt giới hạn. Riêng Leverage cao không phải là dấu hiệu dị biệt, vì các điểm góc và điểm sao của thiết kế vốn có Leverage cao.",
  "Trước khi xử lý từng Run, cần xem đồ thị Residuals vs Run. Nếu phần dư thay đổi có xu hướng theo thứ tự Run, nguyên nhân là độ trôi của hệ thống (cột, pha động, nhiệt độ) và phải xử lý ở mức toàn bộ dãy, không phải ở từng Run.",
  "Khi cùng một Run bị đánh dấu ở nhiều đáp ứng, nguyên nhân thường nằm ở chính lần chạy đó (pha mẫu, tiêm mẫu, nhầm phương pháp) chứ không phải ở mô hình; cần ưu tiên kiểm tra dữ liệu thô và thực nghiệm lặp lại.",
  "Kiểm tra dữ liệu thô trong sắc ký gồm: đường nền và cách tích phân; nhận diện pic, đặc biệt khi hai pic có thể đã đảo thứ tự; vị trí lọ mẫu và phương pháp đã nạp; áp suất và nhiệt độ ghi nhận trong lần chạy.",
  "Chỉ sửa hoặc thay dữ liệu khi có nguyên nhân xác định được và được ghi lại. Kết quả ban đầu và lý do xử lý phải được lưu trong hồ sơ; không xóa dữ liệu chỉ để cải thiện chỉ số thống kê.",
  "Chỉ bổ sung số hạng bậc cao khi thiết kế cho phép ước lượng số hạng đó và Predicted R² không giảm. Thiết kế FCD và BBD chỉ hỗ trợ mô hình đến bậc hai; muốn dùng số hạng bậc ba phải bổ sung điểm thực nghiệm."],
  flow:[

  x:["Run 9 có Externally Studentized Residual vượt giới hạn ở 3 trong 5 đáp ứng. Kiểm tra sắc ký đồ cho thấy đường nền bị dâng ở cuối lần chạy và pic cuối cùng bị tích phân thiếu: đây là sai sót xác định được nguyên nhân. Tích phân lại, ghi lý do, cập nhật kết quả và phân tích lại mô hình.",
     "Run 7 chạy tại pH 4,5, gần pKa 4,2 của tạp chất B, cho Rs thấp hơn dự đoán. Dữ liệu thô không có sai sót, thực nghiệm lặp lại cho kết quả như cũ, và phép biến đổi đáp ứng không đưa được Run này vào giới hạn. Vùng pH quanh pKa không phải là vùng vận hành mong muốn vì thời gian lưu thay đổi mạnh theo pH. Kết luận: thu hẹp khoảng pH khảo sát về 2,5–3,5 và không đặt PAR chạm vào vùng pH trên 4,0."]},
 {id:"lof", t:"Lack of Fit có ý nghĩa thống kê trong HPLC", s:["models"], b:[
  "Kiểm định Lack of Fit so sánh sai lệch giữa mô hình và dữ liệu với sai số thuần ước lượng từ các điểm lặp lại: F = trung bình bình phương của Lack of Fit chia cho trung bình bình phương của sai số thuần. Giá trị p nhỏ hơn 0,05 cho thấy mô hình có thể thiếu số hạng.",
  "Trong HPLC, Lack of Fit có ý nghĩa thống kê thường xuất hiện khi sai số thuần rất nhỏ, đặc biệt khi các điểm tâm được tiêm lặp lại từ cùng một lọ. Khi đó mẫu số của F gần bằng 0 và một sai lệch rất nhỏ của mô hình cũng cho F lớn.",
  "Trước khi kết luận đây là cảnh báo giả, cần kiểm tra đồ thị Residuals vs từng yếu tố: nếu có dạng đường cong, mô hình thật sự thiếu số hạng bậc hai và cần bổ sung.",
  "Biện luận để tiếp tục sử dụng mô hình dựa trên bốn bằng chứng: R², Adjusted R² và Predicted R² đều cao, chênh lệch giữa Adjusted R² và Predicted R² nhỏ hơn 0,2; Adeq Precision lớn hơn 4; đồ thị Predicted vs Actual có các điểm gần đường chéo; độ lệch chuẩn của mô hình không đáng kể so với dung sai kỹ thuật của đáp ứng.",
  "Không loại bỏ điểm tâm để tránh Lack of Fit. Trong các nghiên cứu sau, pha độc lập từng điểm tâm để sai số thuần phản ánh đúng sai số của toàn bộ quy trình (cân, pha loãng, tiêm, thiết bị).",
  "Khi thiết kế chưa có điểm lặp lại (ví dụ các điểm tâm chưa chạy và đang đặt Ignore), bảng ANOVA không có dòng Lack of Fit; ứng dụng ghi nhận trường hợp này là NA."],
  x:["Đáp ứng α của một cặp tạp chất: p của Lack of Fit = 0,018; trung bình bình phương của sai số thuần = 3 × 10⁻⁶; F = 54. Đồng thời R² = 0,978; Adjusted R² = 0,962; Predicted R² = 0,909; Adeq Precision = 31,2; độ lệch chuẩn của mô hình = 0,006 đơn vị α.",
     "Câu biện luận mẫu: “Mô hình có Lack of Fit có ý nghĩa thống kê (p = 0,018). Nguyên nhân là sai số thuần được ước lượng từ các lần tiêm lặp lại trên cùng một lọ mẫu, chỉ phản ánh độ lặp lại của hệ thống sắc ký. Sai số dự đoán của mô hình (± 0,006) không có ý nghĩa thực tiễn đối với đáp ứng. Các chỉ số R², Adjusted R², Predicted R² và Adeq Precision cho thấy mô hình đủ tin cậy để định hướng trong vùng khảo sát.”"]},
 {id:"mgraph", t:"Đọc các đồ thị của mô hình (Model Graphs)", s:["models","optim"], b:[
  "Các đồ thị tại mục Model Graphs của từng đáp ứng biểu diễn giá trị dự đoán của đáp ứng theo các yếu tố, chỉ có sau khi đã nhập kết quả và phân tích.",
  "Perturbation: so sánh ảnh hưởng của tất cả các yếu tố tại một điểm tham chiếu, thường là điểm tâm. Đường càng dốc hoặc càng cong, yếu tố càng ảnh hưởng mạnh; đường gần nằm ngang cho thấy yếu tố ít ảnh hưởng. Đồ thị này không thể hiện tương tác giữa các yếu tố.",
  "Interaction: hai đường không song song cho thấy ảnh hưởng của yếu tố này phụ thuộc vào mức của yếu tố kia. Khi phần mềm cảnh báo yếu tố tham gia vào tương tác, không kết luận từ đồ thị một yếu tố mà phải xem đồ thị Interaction hoặc Contour.",
  "Contour và 3D Surface: thể hiện đáp ứng theo hai yếu tố, các yếu tố còn lại được giữ tại giá trị đặt trong Factors Tool. Các đường đồng mức gần song song với một trục cho thấy yếu tố trên trục đó ít ảnh hưởng.",
  "Cube: giá trị dự đoán tại 8 góc của vùng khảo sát với 3 yếu tố, dùng để so sánh nhanh điều kiện tốt nhất và kém nhất.",
  "Trước khi xuất hình, cần đặt lại trục của đồ thị về đúng khoảng khảo sát của yếu tố và đặt các yếu tố không nằm trên trục tại điểm cài đặt. Phần đồ thị nằm ngoài khoảng khảo sát là ngoại suy và không được dùng để kết luận."],
  x:["Đồ thị Perturbation của Rs: đường của % acetonitril dốc mạnh, đường của nhiệt độ cột gần nằm ngang. Kết luận: Rs nhạy với sai số pha động và ít nhạy với nhiệt độ cột; chiến lược kiểm soát cần tập trung vào độ chính xác khi pha hoặc trộn pha động.",
     "Đồ thị Interaction của α theo % hữu cơ ban đầu (A) tại hai mức độ dốc gradient (B): tại A thấp, hai đường cách xa nhau; tại A cao, hai đường gần trùng nhau. Như vậy độ dốc gradient chỉ ảnh hưởng rõ đến α khi % hữu cơ ban đầu thấp; hai yếu tố này phải được chọn cùng nhau."]},
 {id:"sd", t:"Độ lệch chuẩn của yếu tố dùng cho POE", s:["optim"], b:[
  "POE (Propagation of Error, lan truyền sai số) là độ lệch chuẩn của đáp ứng do dao động của các yếu tố truyền qua mô hình. Để phần mềm tính POE, cần nhập độ lệch chuẩn của từng yếu tố tại Design → Column Info Sheet.",
  "Nguồn số liệu phù hợp nhất là hồ sơ thẩm định thiết bị (OQ, PQ) của chính hệ thống đang dùng. Thông số kỹ thuật của nhà sản xuất chỉ nên dùng để tham khảo vì không phản ánh tình trạng hiện tại của thiết bị.",
  "Độ lệch chuẩn của pH lấy từ sai số thao tác pha và đo pH, thường khoảng 0,05 đơn vị pH với máy đo được hiệu chuẩn định kỳ.",
  "Khi hồ sơ chỉ cho sai lệch tối đa hoặc giới hạn dung sai (± a), quy đổi thành độ lệch chuẩn bằng a/3 nếu xem ± a là khoảng ± 3σ của phân bố chuẩn. Cách quy đổi thận trọng hơn là a/√3, xem sai lệch phân bố đều trong khoảng ± a; cách này cho độ lệch chuẩn lớn hơn và POE lớn hơn.",
  "Thời gian được điều khiển bằng mạch điện tử nên sai số rất nhỏ; độ lệch chuẩn của thời gian gradient hoặc thời gian giữ ban đầu có thể đặt 0,01 phút.",
  "Độ dốc gradient là đại lượng dẫn xuất từ % hữu cơ và thời gian nên khó gán độ lệch chuẩn. Khi dự kiến dùng POE, nên chọn thời gian gradient làm yếu tố khảo sát thay cho độ dốc."],
  x:["Số liệu từ một hồ sơ PQ: độ lệch chuẩn tương đối của tốc độ dòng là 0,193% tại 1,0 ml/phút, nên độ lệch chuẩn = 1,0 × 0,193/100 = 0,002 ml/phút. Sai lệch tối đa của tỷ lệ trộn là 0,5%, nên độ lệch chuẩn = 0,5/3 = 0,17% (hoặc 0,5/√3 = 0,29% theo cách thận trọng). Độ ổn định nhiệt độ buồng cột là ± 0,2 °C: nếu đây là sai lệch tối đa, độ lệch chuẩn = 0,2/3 = 0,07 °C; dùng trực tiếp 0,2 °C là cách thận trọng."]},
 {id:"goal", t:"Thiết lập Goal và Importance", s:["optim"], b:[
  "Nguyên tắc chung: không tối ưu hóa mọi đáp ứng đến cực trị. Phần lớn đáp ứng chỉ cần đạt tiêu chí; chỉ một hoặc hai đáp ứng cần Maximize hoặc Minimize.",
  "Maximize: dùng cho Rs của cặp khó tách, α* hoặc |ΔtR|, N khi cần pic hẹp. Minimize: dùng cho tR của pic cuối cùng. Target: dùng khi cần đáp ứng tiến đến một giá trị cụ thể, ví dụ k của pic chính hoặc tR khi cần khớp với phương pháp đã có.",
  "In range: đáp ứng chỉ cần nằm trong khoảng chấp nhận, ví dụ Tf từ 0,8 đến 1,5 hoặc áp suất dưới giới hạn của thiết bị. Với giới hạn một phía, xóa giới hạn còn lại trong ô nhập của Design-Expert. In range là điều kiện ràng buộc: nghiệm vi phạm bị loại, và trong khoảng cho phép mọi giá trị được xem như nhau.",
  "Importance (từ 1 đến 5 dấu cộng) là trọng số tương đối giữa các mục tiêu Maximize, Minimize và Target khi tính Desirability tổng hợp. Importance không tạo thứ tự ưu tiên tuyệt đối và không có tác dụng đối với mục tiêu In range.",
  "Mâu thuẫn thường gặp trong HPLC là độ phân giải cao đi kèm thời gian phân tích dài. Cách thiết lập khuyến nghị: Rs của cặp khó tách đặt In range từ giá trị tiêu chí trở lên (hoặc Maximize với Importance 5); tR của pic cuối cùng đặt Minimize với Importance 3; Tf hoặc As đặt In range; áp suất đặt In range.",

/* Số thập phân dài: nới rộng cột của bảng để số không bị che khuất. */
let fitCtx = null;
function fitNeed(i){ if (!i.value) return 0; fitCtx = fitCtx || document.createElement("canvas").getContext("2d"); const cs = getComputedStyle(i); fitCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  return Math.ceil(fitCtx.measureText(i.value).width + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 6 - i.clientWidth); }
function fitTables(root){ (root || document).querySelectorAll("table.fx").forEach(t => {
  const cols = [...t.querySelectorAll("colgroup col")], head = t.tHead && t.tHead.rows[0]; if (!head || head.cells.length !== cols.length) return;
  const add = cols.map(() => 0); let any = false;
  t.querySelectorAll("tbody td").forEach(td => { const ins = td.querySelectorAll("input[data-fit]"); let d = 0; ins.forEach(i => { d = Math.max(d, fitNeed(i)); }); d *= ins.length; if (d > 0){ any = true; add[td.cellIndex] = Math.max(add[td.cellIndex] || 0, d); } });
  if (!any) return;
  const w = [...head.cells].map((c, k) => c.getBoundingClientRect().width + add[k]); const sum = w.reduce((a, b) => a + b, 0);
  cols.forEach((c, k) => { c.style.width = w[k] + "px"; }); t.style.width = sum + "px"; t.style.minWidth = sum + "px"; }); }
function fitW(v){ return `calc(${Math.min(Math.max(String(v ?? "").length, 3), 24)}ch + 1.4rem)`; }
function sel(path, opts, o = {}){ const v = getPath(P, path);
  return `<select id="${pid(path)}" data-p="${path}" data-t="text" ${o.w ? `style="width:${o.w}"` : ""} aria-label="${esc(o.label || path)}">${Object.entries(opts).map(([k, l]) => `<option value="${esc(k)}" ${String(v) === k ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`; }
function ta(path, o = {}){ return `<textarea id="${pid(path)}" data-p="${path}" data-t="text" ${o.rows ? `rows="${o.rows}"` : ""} placeholder="${esc(o.ph || "")}" aria-label="${esc(o.label || path)}" ${o.sans ? 'style="font-family:var(--font);font-size:0.8125rem"' : ""}>${esc(getPath(P, path) ?? "")}</textarea>`; }
function fld(label, html){ return `<div class="fld"><div class="fl"><label>${label}</label>${HELP[label] ? helpBtn(label) : ""}</div><div class="fc">${html}</div></div>`; }
function thHelp(root){ root.querySelectorAll("table").forEach(t => { if (!t.querySelector("tbody input, tbody select, tbody textarea")) return; t.querySelectorAll("thead th").forEach(th => { const k = th.textContent.trim(); if (HELP[k] && !th.querySelector(".hbtn")) th.insertAdjacentHTML("beforeend", helpBtn(k)); }); }); }

function cg(w){ const t = w.reduce((a, b) => a + b, 0); return `<colgroup>${w.map(x => `<col style="width:${(x / t * 100).toFixed(2)}%">`).join("")}</colgroup>`; }

/* ============ Sao chép bảng: định dạng bảng cho Word và văn bản phân cột cho Excel ============ */
async function copyTables(tables, btn){
  const E = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const cell = v => SCI.toUnicode(String(v ?? ""));
  const isNum = v => /^[\s\d.,:→−+\-–%]*$/.test(String(v ?? ""));
  const html = tables.map(t => (t.title ? `<p style="font-family:Arial,sans-serif;font-size:10pt;font-weight:bold;margin:8pt 0 3pt">${E(cell(t.title))}</p>` : "") + `<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:10pt"><thead><tr>${t.head.map(h => `<th style="background:#003A4F;color:#FFFFFF;font-weight:bold;text-align:center;vertical-align:middle;border:1px solid #7F7F7F;padding:4px 6px">${E(cell(h))}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map(v => `<td style="border:1px solid #7F7F7F;padding:3px 6px;vertical-align:middle;text-align:${isNum(v) ? "center" : "left"}">${E(cell(v))}</td>`).join("")}</tr>`).join("")}</tbody></table>`).join("<br>");
  const text = tables.map(t => (t.title ? cell(t.title) + "\n" : "") + [t.head].concat(t.rows).map(r => r.map(cell).join("\t")).join("\n")).join("\n\n");
  let ok = false;
  try {
    const holder = document.createElement("div"); holder.setAttribute("style", "position:fixed;left:-9999px;top:0;background:#fff;color:#000"); holder.innerHTML = html; document.body.appendChild(holder);
    const sel0 = window.getSelection(); const range = document.createRange(); range.selectNodeContents(holder); sel0.removeAllRanges(); sel0.addRange(range);
    const h = e => { e.clipboardData.setData("text/html", html); e.clipboardData.setData("text/plain", text); e.preventDefault(); };
    document.addEventListener("copy", h); ok = document.execCommand("copy"); document.removeEventListener("copy", h); sel0.removeAllRanges(); holder.remove();
  } catch(e){}
  if (!ok){ try { await navigator.clipboard.write([new ClipboardItem({"text/html": new Blob([html], {type: "text/html"}), "text/plain": new Blob([text], {type: "text/plain"})})]); ok = true; } catch(e){} }
  if (!ok) return copy(text, btn);
  if (btn){ const o = btn.textContent; btn.textContent = "Đã sao chép ✓"; setTimeout(() => btn.textContent = o, 1500); }
}

/* Giải thích hiện trong bong bóng nổi cạnh dấu “?”, không chèn vào nội dung nên bố cục trang không xô lệch. */
let popEl = null, popBtn = null;

function placePop(){
  if (!popEl || !popBtn) return; if (!popBtn.isConnected){ closePop(); return; }
  const r = popBtn.getBoundingClientRect(), vw = document.documentElement.clientWidth, vh = window.innerHeight;
  if (r.bottom < 0 || r.top > vh || r.right < 0 || r.left > vw){ closePop(); return; }
  const pw = popEl.offsetWidth, ph = popEl.offsetHeight;
  const left = Math.max(8, Math.min(r.left + r.width / 2 - pw / 2, vw - pw - 8));

/* Kiểm tra cấu hình yếu tố – kênh bơm: mọi xung đột đều được báo, không có yếu tố nào bị bỏ qua âm thầm. */

  if (by.total_org && by.total_org_free) bad(`Không dùng đồng thời hai loại ${tl("total_org")} và ${tl("total_org_free")}: cả hai cùng đặt tổng hữu cơ.`);
  fs.forEach(f => { const lo = num(f.low), hi = num(f.high); if (lo === null || hi === null) wrn(`Yếu tố ${lab(f)} chưa có mức thấp hoặc mức cao.`); else if (lo >= hi) bad(`Yếu tố ${lab(f)}: mức thấp (${lo}) phải nhỏ hơn mức cao (${hi}).`);
    else { if (["total_org", "total_org_free", "org2_share", "channel_pct", "grad_start", "grad_end"].includes(f.type) && (lo < 0 || hi > 100)) bad(`Yếu tố ${lab(f)}: giá trị phần trăm phải nằm trong 0–100.`);

/* Kiểm tra ma trận đã dán */
function designIssues(){

  if (dataLike > P.design.length) out.push({k:"bad", t:`${dataLike - P.design.length} dòng số liệu không đọc được: mỗi dòng cần đủ ${2 + keys.length} cột số theo thứ tự Std, Run, ${keys.join(", ")}.`});
  const seen = {}, dup = []; P.design.forEach(r => { if (seen[r.run]) dup.push(r.run); seen[r.run] = 1; });
  if (dup.length) out.push({k:"bad", t:`Số Run bị trùng: ${[...new Set(dup)].join(", ")}. Mỗi Run phải có một số thứ tự riêng vì kết quả được ghép theo số Run.`});
  P.factors.forEach(f => { const lo = num(f.low), hi = num(f.high); if (lo === null || hi === null || !P.design.length) return; const v = P.design.map(r => num(r[f.key])).filter(x => x !== null); const mn = Math.min(...v), mx = Math.max(...v);
    if (P.designType !== "CCD" && (mn < lo - 1e-9 || mx > hi + 1e-9)) out.push({k:"warn", t:`Yếu tố ${f.key}: ma trận có giá trị ${fmt(mn)}–${fmt(mx)}, ngoài khoảng ${lo}–${hi} đã khai báo ở bước 2. Kiểm tra thứ tự cột hoặc khoảng khảo sát.`});
    else if (mn > lo + 1e-9 || mx < hi - 1e-9) out.push({k:"warn", t:`Yếu tố ${f.key}: ma trận chỉ có giá trị ${fmt(mn)}–${fmt(mx)}, không đạt tới khoảng ${lo}–${hi} đã khai báo ở bước 2. Kiểm tra thứ tự cột.`}); });

}

/* Unique methods numbered by first appearance in DX run order. */
function buildMethods(){

  const map = new Map(), methods = [], runPP = {};
  rows.forEach(r => {
    const t = translatePoint(r);

function scoutCorners(){

  const out = [];

    const row = {}; P.factors.forEach((f, i) => row[f.key] = (m >> i) & 1 ? rng[i][1] : rng[i][0]);
    const t = translatePoint(row); const inDesign = P.design.some(r => P.factors.every(f => num(r[f.key]) === row[f.key]));

    out.push({row, t, inDesign, org});

  const mn = Math.min(...out.map(o => o.org)), mx = Math.max(...out.map(o => o.org));
  out.forEach(o => o.tag = o.org === mn ? "lưu giữ mạnh nhất" : o.org === mx ? "lưu giữ yếu nhất" : "");
  return out;

  ${doe !== P.design.length * reps ? flagHtml([{k:"bad", t:"Số lần tiêm DoE không khớp với số Run của ma trận thiết kế."}]) : flagHtml([{k:"ok", t:`Trình tự gồm ${seq.length} dòng, đủ ${doe} lần tiêm DoE cho ${P.design.length} Run${reps > 1 ? `, mỗi Run tiêm ${reps} lần` : ""}; trong đó ${P.design.length - buildMethods().methods.length} Run lặp lại điều kiện của Run khác. Theo thiết lập hiện tại: ${eqTxt}; ${nBl ? nBl + " lần tiêm mẫu trắng" : "không tiêm mẫu trắng"}.`}])}

}

/* ---- Step 5 ---- */
function vResults(){
  fillDerived();
  if (!P.design.length) return head("Kết quả thực nghiệm", "") + `<div class="empty">Cần ma trận Design-Expert ở bước 3.</div>`;
  const {runPP, methods} = buildMethods(); const rows = P.design.slice().sort((a, b) => a.run - b.run);
  const missing = rows.filter(r => !P.results[r.run]);
  const vals = rk => rows.map(r => respValue(r.run, rk)).filter(v => v !== null);
  const med = a => { const s = a.slice().sort((x, y) => x - y); const n = s.length; return !n ? null : n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
  const auto = designChecks("results").filter(x => /điểm tâm/.test(x.t) && x.k !== "ok" && /kết quả/.test(x.t));
  P.responses.forEach(rsp => { const md = med(vals(rsp.key)); rows.forEach(r => { const v = respValue(r.run, rsp.key); if (v === null) return;
    if (rsp.kind === "N" && md && v < 0.5 * md) auto.push({k:"bad", t:`Run ${r.run} (${runPP[r.run]}): ${rL(rsp.key)} = ${v}, thấp hơn 50% giá trị trung vị (${md}). Cần kiểm tra lại việc tích phân và khả năng pic bị tách đôi.`});
    }); });
  const accSum = P.responses.filter(r => r.acc && r.acc.op && r.acc.op !== "none").map(r => { const vs = vals(r.key); if (!vs.length) return null; return {r, n: vs.length, ok: vs.filter(v => meets(r, v) !== false).length, lo: Math.min(...vs), hi: Math.max(...vs)}; }).filter(Boolean);
  accSum.filter(a => a.ok === 0).forEach(a => auto.push({k:"warn", t:`${rL(a.r.key)}: không có Run nào đạt tiêu chí ${accText(a.r)} (giá trị từ ${fmt(a.lo, 2)} đến ${fmt(a.hi, 2)}). Cần xem lại khoảng khảo sát hoặc tiêu chí trước khi tối ưu hóa.`}));
  const accHtml = accSum.length ? `<p class="hint"><b>Số Run đạt tiêu chí chấp nhận của bước 1:</b> ${accSum.map(a => `${esc(rL(a.r.key))}: ${a.ok}/${a.n} (từ ${fmt(a.lo, Math.abs(a.hi) >= 100 ? 0 : 2)} đến ${fmt(a.hi, Math.abs(a.hi) >= 100 ? 0 : 2)}; tiêu chí ${esc(accText(a.r))})`).join("; ")}. Kết quả không đạt tiêu chí tại một số Run là bình thường trong thiết kế thực nghiệm và không cần xử lý: các Run này giúp mô hình xác định biên của vùng vận hành. Giá trị không đạt được hiển thị bằng chữ đỏ trong bảng.</p>` : "";
  rows.forEach(r => P.responses.forEach(rsp => { if (P.naFlags[r.run] && P.naFlags[r.run][rsp.key]) auto.push({k:"warn", t:`Run ${r.run} (${runPP[r.run]}): CDS không báo cáo ${rL(rsp.key)} (n.a.). ${P.naPolicy === "zero" ? "Ứng dụng nhập 0 theo giả định hai pic chập hoàn toàn; cần ghi rõ giả định này trong báo cáo" : "Ô được để trống và Run bị loại khỏi mô hình của đáp ứng này"}.`}); }));
  if (Object.values(P.naFlags || {}).some(o => Object.values(o || {}).some(Boolean))) auto.push({k:"info", t:"Theo sổ tay kinh nghiệm: khi hai pic chập hoàn toàn, nên gán Rs = 0 để quá trình tối ưu hóa tránh vùng chập pic. Khi pic tạp nhỏ nằm sát pic chính lớn và CDS báo n.a., tiêm riêng từng chất để xác định tR, sau đó dùng α* hoặc |ΔtR|."});
  if (missing.length) auto.push({k:"warn", t:`${missing.length} Run chưa có kết quả: ${missing.map(r => r.run + " (" + runPP[r.run] + ")").join(", ")}. Trong Design-Expert, nhấp chuột phải vào số hàng của các Run này và chọn Ignore Row, hoặc chạy bổ sung.`});
  const grid = rows.map(r => { const has = !!P.results[r.run];
    return `<tr><td>${r.std}</td><td>${r.run}</td><td class="id">${runPP[r.run]}</td>${factorKeys().map(k => `<td>${fmt(r[k])}</td>`).join("")}
    ${P.responses.map(rsp => { const na = P.naFlags[r.run] && P.naFlags[r.run][rsp.key]; if (!has) return `<td class="ign">—</td>`;
      const v = respValue(r.run, rsp.key); const bad = v !== null && meets(rsp, v) === false;
      return `<td class="${na ? "na" : ""} ${bad ? "hl" : ""} ${isDerived(rsp) && P.peakTables[r.run] ? "calc" : ""}"><input id="${pid("res." + r.run + "." + rsp.key)}" data-res="${r.run}|${rsp.key}" value="${na ? "n.a." : esc(P.results[r.run][rsp.key] ?? "")}" data-fit="1" title="${na ? "n.a." : esc(P.results[r.run][rsp.key] ?? "")}" style="width:78px;min-width:${fitW(na ? "n.a." : (P.results[r.run][rsp.key] ?? ""))};text-align:right" aria-label="Run ${r.run} ${rsp.key}"></td>`; }).join("")}
    <td>${has ? `<button class="btn sm" data-a="clearRun" data-run="${r.run}">Xóa</button>` : `<button class="btn sm" data-a="addRun" data-run="${r.run}">+ Nhập</button>`}</td></tr>`; }).join("");
  const ocr = ocrResult ? `<div class="card"><h2>Kết quả AI đọc từ ảnh, cần kiểm tra trước khi áp dụng <span class="sp"></span><button class="btn pri sm" data-a="applyOcr">Áp dụng vào Run đã chọn</button><button class="btn sm" data-a="dropOcr">Bỏ</button></h2>
    ${ocrResult.map((bk, i) => `<div style="margin:10px 0"><div class="row"><b>${esc(bk.label || "Bảng " + (i + 1))}</b> → Run <select id="ocrRun${i}" data-ocr="${i}">${rows.map(r => `<option value="${r.run}" ${String(bk.run ?? guessRun(bk.label, i, runPP)) === String(r.run) ? "selected" : ""}>${r.run} (${runPP[r.run]})</option>`).join("")}<option value="">bỏ qua</option></select></div>
    <div class="tw"><table><thead><tr><th>Số thứ tự</th><th>tR, phút</th><th>Tên pic</th><th>Diện tích pic</th><th>As</th><th>Rs</th><th>N</th></tr></thead><tbody>${(bk.peaks || []).map(p => `<tr><td>${esc(p.no)}</td><td>${esc(p.rt)}</td><td class="l">${esc(p.name)}</td><td>${esc(p.area)}</td><td>${esc(p.as)}</td><td>${esc(p.rs)}</td><td>${esc(p.n)}</td></tr>`).join("")}</tbody></table></div></div>`).join("")}</div>` : "";
  return head("Kết quả thực nghiệm", "Kết quả được chép nguyên từ CDS theo một trong hai cách: dùng ảnh chụp bản in của CDS để AI đọc, hoặc nhập trực tiếp vào bảng kết quả. Chỉ các đáp ứng thứ cấp không có sẵn trong CDS mới được tính. Bảng kết quả được sắp theo đúng thứ tự Run để sao chép sang Design-Expert.") +
  `<div class="card"><h2>Nhập kết quả từ ảnh chụp bản in của CDS <span class="sp"></span><label class="btn sm" for="ocrFile" style="cursor:pointer">+ Thêm ảnh</label><input type="file" id="ocrFile" class="vh" accept="image/*" multiple aria-label="Thêm ảnh bản in"></h2>
    <p class="hint" style="margin-top:0">Ảnh cần rõ nét và chụp thẳng góc. Có thể thêm ảnh nhiều lần hoặc kéo thả ảnh vào trang; ảnh mới được bổ sung vào danh sách, không thay thế ảnh đã có. AI trả về bảng kết quả để người thực hiện kiểm tra trước khi áp dụng.</p>
    <div class="row" style="gap:6px"><span class="hint" style="margin:0">${ocrFiles.length ? `Ảnh đã thêm (${ocrFiles.length}):` : "Chưa thêm ảnh nào."}</span>${fileChips(ocrFiles.map((f, i) => ({id: i, name: f.name})), "rmOcr")}</div>
    <div class="row" style="margin-top:8px">${aiBtn("ocr", "", ocrFiles.length ? "" : "disabled")}${ocrFiles.length > 1 ? `<button class="btn sm" data-a="clearOcr">Gỡ tất cả ảnh</button>` : ""}</div><div id="ai_ocr">${aiBox("ocr")}</div></div>${ocr}
  <div class="card"><h2>Quy ước xử lý dữ liệu</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr))">${fld("Quy ước báo cáo Rs của CDS", sel("rsConv", {next:"Rs của một pic được tính với pic rửa giải kế tiếp", prev:"Rs của một pic được tính với pic rửa giải liền trước"}))}${fld("Xử lý ô n.a. khi xuất sang Design-Expert", sel("naPolicy", {zero:"Nhập 0 – hai pic chập hoàn toàn (khuyến nghị)", blank:"Để trống – loại Run khỏi đáp ứng đó"}))}</div></div>
  <div class="card"><h2>Bảng kết quả theo thứ tự Run của Design-Expert <span class="sp"></span>${aiBtn("results")}<button class="btn pri sm" data-a="copyDX">Sao chép các cột đáp ứng để dán vào Design-Expert</button></h2>
   ${flagHtml(auto)}${accHtml}<div id="ai_results">${aiBox("results")}</div>
   <div class="tw" style="max-height:620px;overflow:auto"><table><thead><tr><th>Std</th><th>Run</th><th>Phương pháp</th>${factorKeys().map(k => `<th>${k}</th>`).join("")}${P.responses.map(r => `<th title="${esc(isDerived(r) ? derivedText(r) : r.name)}">${r.key}${isDerived(r) ? " · tính" : ""}<br><span style="font-weight:400;font-size:0.6875rem">${esc(r.name.length > 22 ? r.name.slice(0, 22) + "…" : r.name)}</span></th>`).join("")}<th></th></tr></thead><tbody>${grid}</tbody></table></div>${derivedNote()}
   <p class="hint">Ô nền đỏ: n.a.; chữ đỏ: không đạt tiêu chí; hàng xám: Run chưa chạy. Nút “Sao chép” lấy đúng ${rows.length} dòng theo thứ tự Run, ô trống ở Run chưa chạy.</p></div>`;
}
function guessRun(label, i, runPP){
  const m = String(label || "").match(/(\d+)/); const name = m ? (P.tr.prefix || "PP-") + m[1].padStart(2, "0") : null;
  const rows = P.design.slice().sort((a, b) => a.run - b.run);
  if (name){ const r = rows.find(x => runPP[x.run] === name); if (r) return r.run; }
  const {methods} = buildMethods(); return methods[i] ? methods[i].runs[0] : "";
}

/* ---- Step 6 ---- */
function vModels(){
  const imp = impBar();
  if (!P.responses.length) return head("Mô hình ANOVA", "") + imp + `<div class="empty">Chưa có đáp ứng. Nhập tệp Analysis summary để tạo tự động, hoặc khai báo ở bước 1.</div>`;
  const TR = {"":"None", "Natural Log":"Natural Log", "Base 10 Log":"Base 10 Log", "Square Root":"Square Root", "Inverse Sqrt":"Inverse Sqrt", "Inverse":"Inverse", "Power":"Power", "Logit":"Logit", "ArcSin Sqrt":"ArcSin Sqrt"};
  const cards = P.responses.map(r => { const m = P.models[r.key] || {}; const f = modelFlags(P.models[r.key]); const base = `models.${r.key}.`;
    const st = mStatus(P.models[r.key]);
    return `<div class="mcard st-${st}"><h3>${esc(rL(r.key))} · ${esc(r.name)}${st === "none" ? ` <span class="hint" style="font-weight:400;margin:0">chưa có số liệu</span>` : ""}</h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(105px,1fr))">
      ${fld("Mô hình", inp(base + "model", {ph:"Reduced Linear"}))}${fld("Biến đổi", sel(base + "transform", TR))}${fld("p mô hình", inp(base + "pModel", {ph:"< 0.0001"}))}${fld("p Lack of Fit", inp(base + "pLoF", {ph:"NA"}))}
      ${fld("R²", inp(base + "R2"))}${fld("R²adj", inp(base + "adjR2"))}${fld("R²pred", inp(base + "predR2"))}${fld("Adeq Precision", inp(base + "adeq"))}${fld("SD", inp(base + "sd"))}${fld("C.V. %", inp(base + "cv"))}${fld("Run bị loại (Ignore)", inp(base + "ignored"))}</div>
    ${fld("Phương trình Coded", inp(base + "eq", {ph:"+2.90 +2.07A −1.13B"}))}
    ${m.termsP ? `<p class="hint" style="margin:4px 0">Giá trị p của từng số hạng: ${esc(m.termsP)}</p>` : ""}${m.selection ? `<p class="hint" style="margin:4px 0">Chọn mô hình: ${esc(m.selection)}</p>` : ""}
    ${fld("Điểm ngoại lai và điểm ảnh hưởng", inp(base + "outliers"))}
    ${m.ignored || m.outliers ? fld("Lý do loại Run và cách xử lý điểm dị biệt", inp(base + "outNote", {ph:"Ví dụ: Run 12 chưa thực hiện; Run 11 đã kiểm tra tích phân, giữ nguyên trong mô hình."})) : ""}
    ${flagHtml(f)}
    <details><summary class="hint" style="cursor:pointer">Dán văn bản ANOVA để tự điền</summary><textarea id="dxp_${r.key}" rows="4"></textarea><button class="btn sm" data-a="parseDX" data-r="${r.key}" style="margin-top:4px">Tự điền</button></details>
    <div class="row" style="margin-top:8px">${aiBtn("mechanism", r.key)}</div>
    <div id="ai_mechanism${r.key}">${aiText["mechanism" + r.key] ? aiBox("mechanism" + r.key) : m.mechanism ? `<div class="aiout"><span class="tag">[Suy luận AI] – đã lưu</span><div class="md">${md(m.mechanism)}</div></div>` : ""}</div></div>`; }).join("");
  const sum = P.responses.map(r => { const m = P.models[r.key]; if (!m) return ""; const f = modelFlags(m);
    return `<tr class="st-${mStatus(m)}"><td class="id">${esc(rL(r.key))}</td><td class="l">${esc(m.model || "")}${m.transform ? " · " + esc(m.transform) : ""}</td><td class="l mono" style="font-size:0.75rem">${esc(m.eq || "")}</td><td>${esc(m.adjR2 || "")}</td><td>${esc(m.predR2 || "")}</td><td>${num(m.adjR2) !== null && num(m.predR2) !== null ? fmt(num(m.adjR2) - num(m.predR2), 3) : ""}</td><td>${esc(m.adeq || "")}</td></tr>`; }).join("");
  const tips = [];
  const missing = P.factors.filter(fc => P.responses.every(r => { const m = P.models[r.key]; return !m || !new RegExp("(^|[^A-Z])" + fc.key + "([^A-Z]|$)").test((m.termList || m.eq || "").replace(/[0-9.+−-]/g, " ")); }));
  if (P.responses.every(r => P.models[r.key]) && missing.length) tips.push({k:"warn", t:`Yếu tố ${missing.map(fc => fc.key + " (" + fc.name + ")").join(", ")} không có trong mô hình của đáp ứng nào. Nếu lý thuyết hoặc dữ liệu thô cho thấy yếu tố này có ảnh hưởng, cần kiểm tra khả năng điểm dị biệt che lấp ảnh hưởng đó.`});
  const outRuns = {}; P.responses.forEach(r => { const o = (P.models[r.key] || {}).outliers || ""; (o.match(/Run (\d+)/g) || []).forEach(x => { const k = x.replace("Run ", ""); outRuns[k] = (outRuns[k] || 0) + 1; }); });
  Object.entries(outRuns).filter(([, n]) => n >= 3).forEach(([run, n]) => tips.push({k:"bad", t:`Run ${run} được Diagnostics đánh dấu là điểm dị biệt ở ${n}/${P.responses.length} đáp ứng. Khi một Run bị đánh dấu ở nhiều đáp ứng, nguyên nhân thường nằm ở chính lần chạy đó. Trình tự xử lý được trình bày tại chủ đề “Cây quyết định xử lý điểm dị biệt” trong mục kinh nghiệm của bước này.`}));
  if (P.responses.some(r => P.models[r.key] && P.models[r.key].selection && !/AICc.*Backward/i.test(P.models[r.key].selection))) tips.push({k:"info", t:"Có đáp ứng không được chọn mô hình bằng AICc – Backward như khuyến nghị của sổ tay kinh nghiệm."});
  const lof = lofRows();
  const lofCard = lof.length ? `<div class="card"><h2>Biện luận khi Lack of Fit có ý nghĩa thống kê <span class="sp"></span><button class="btn sm" data-a="copyJust" data-k="lof">Sao chép</button></h2><p class="hint">Đoạn biện luận được soạn theo 4 điểm kiểm tra của sổ tay kinh nghiệm; cần đối chiếu biểu đồ Predicted vs Actual trước khi dùng.</p><div class="just">${esc(lofJustText())}</div></div>` : "";
  return head("Phân tích mô hình (ANOVA) và biện giải cơ chế", "Các chỉ số thống kê được chép nguyên từ báo cáo của Design-Expert; ứng dụng không tính lại. Một đáp ứng được đánh dấu không đạt khi p của mô hình ≥ 0,05; p của Lack of Fit < 0,05; R²adj − R²pred > 0,20; hoặc Adeq Precision < 4.") + imp +
  `<div class="card"><h2>Tổng hợp các mô hình <span class="sp"></span>${aiBtn("mechanism", "", 'title="Biện giải tất cả đáp ứng"')}</h2>${flagHtml(tips)}<div class="tw">${tb([1.7, 1.9, 4.6, 1, 1, 1.3, 1.3], 3.3)}<thead><tr><th>Đáp ứng</th><th>Mô hình</th><th>Phương trình theo biến mã hóa</th><th>R²adj</th><th>R²pred</th><th>R²adj − R²pred</th><th>Adeq Precision</th></tr></thead><tbody>${sum}</tbody></table></div><p class="hint">${STLEG}</p><div id="ai_mechanism">${aiBox("mechanism")}</div></div>
  ${lofCard}<div class="cols2">${cards}</div>`;
}
/* ---- Step 7 ---- */
function vOptim(){
  const o = P.opt; const goals = {none:"Không", maximize:"Max", minimize:"Min", target:"Target", range:"In range"};

function controlCheck(c){
  const v = k => num(c[k]); const sp = v("sp"), a = v("norLo"), b = v("norHi"), pl = v("parLo"), ph = v("parHi"), ml = v("modrLo"), mh = v("modrHi");
  if ([sp, a, b, pl, ph].some(x => x === null)) return {ok: false, miss: true, msg: "Chưa đủ số liệu để kiểm tra", margin: null};
  if (!(a <= sp && sp <= b)) return {ok: false, msg: "Điểm cài đặt nằm ngoài NOR", margin: null};
  if (!(pl <= a && b <= ph)) return {ok: false, msg: "NOR nằm ngoài PAR", margin: null};
  if (ml !== null && mh !== null && !(ml <= pl && ph <= mh)) return {ok: false, msg: "PAR nằm ngoài MODR", margin: null};
  const w = ph - pl; const margin = w > 0 ? Math.min(a - pl, ph - b) / w * 100 : null;
  return {ok: true, msg: "", margin};
}

function phFactor(){ return P.factors.find(f => f.type === "ph") || null; }

function kbPanel(st){
  const es = KB.filter(e => e.s.includes(st)); if (!es.length) return "";
  return `<details class="kb"><summary><span class="kbi sm" aria-hidden="true">${BOOK}</span>Kinh nghiệm Design-Expert cho bước này · ${es.length} chủ đề</summary>${es.map(e => `<details class="kbt"><summary>${esc(e.t)}</summary><ul>${e.b.map(x => `<li>${esc(x)}</li>`).join("")}</ul>${kbFlow(e)}${kbEx(e)}</details>`).join("")}<div class="row" style="margin-top:10px"><button class="btn sm" data-a="openKB">Mở toàn bộ sổ tay</button><span class="hint" style="margin:0">Biên soạn từ tài liệu “Kinh nghiệm áp dụng Design-Expert trên thực tế” của nhóm, có đối chiếu với tài liệu hướng dẫn của Stat-Ease.</span></div></details>`;
}
function openKB(q){
  $("#modalRoot").innerHTML = `<div class="modal" data-a="modalBg"><div class="box"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="color:var(--navy);display:flex;align-items:center;gap:10px"><span class="kbi" aria-hidden="true">${BOOK}</span>Sổ tay kinh nghiệm Design-Expert</h2><button class="btn sm" data-a="closeModal">Đóng</button></div><input type="text" id="kbSearch" placeholder="Tìm: Lack of Fit, điểm tâm, POE, chập pic…" value="${esc(q)}"><div id="kbList" style="margin-top:10px"></div></div></div>`;
  renderKBList(q); const el = $("#kbSearch"); if (el) el.focus();
}
function renderKBList(q){
  const n = String(q || "").toLowerCase().trim(); const el = $("#kbList"); if (!el) return;
  const es = KB.filter(e => !n || (e.t + " " + e.b.join(" ") + " " + (e.x || []).join(" ") + " " + (e.flow || []).map(n => n.t + " " + (n.side || "")).join(" ")).toLowerCase().includes(n));
  const stepName = id => { const i = STEPS.findIndex(x => x.id === id); return i >= 0 ? `Bước ${i + 1}` : ""; };
  el.innerHTML = es.length ? es.map(e => `<details class="kb kbt" style="margin-bottom:8px" ${n ? "open" : ""}><summary>${esc(e.t)} <span class="hint" style="font-weight:400">${e.s.map(stepName).join(", ")}</span></summary><ul style="margin-top:6px">${e.b.map(x => `<li>${esc(x)}</li>`).join("")}</ul>${kbFlow(e)}${kbEx(e)}</details>`).join("") : `<div class="empty">Không có mục phù hợp.</div>`;
  sciDom(el);
}

/* ============ Design checks ============ */
function centerInfo(){
  if (!P.design.length || !P.factors.length) return {n: 0, ran: 0};
  const mids = P.factors.map(f => { const [lo, hi] = designRange(f.key); return (lo + hi) / 2; });
  const isC = r => P.factors.every((f, i) => Math.abs(num(r[f.key]) - mids[i]) < 1e-9);
  return {n: P.design.filter(isC).length, ran: P.design.filter(r => isC(r) && P.results[r.run]).length};
}
function designChecks(scope){
  const out = []; if (!P.factors.length) return out;
  if (P.designType === "CCD") out.push({k:"warn", t:"CCD đặt điểm sao ngoài khoảng ±1 và cần 5 mức pha; sổ tay kinh nghiệm khuyến nghị dùng FCD cho HPLC. Kiểm tra điểm sao vẫn trong giới hạn cột và máy ở bước 3."});
  if (P.designType === "BBD" && P.factors.length <= 4) out.push({k:"info", t:"BBD bỏ trống các góc; với ≤ 4 yếu tố sổ tay kinh nghiệm khuyến nghị dùng FCD để không bỏ sót góc worst-case."});
  const fds = num(P.fds); if (fds !== null) out.push(fds >= 0.8 ? {k:"ok", t:`FDS = ${fds} ≥ 0,8: đủ cho tối ưu hóa${fds < 1 ? "; dùng cho QbD nên đạt 1,0" : ""}.`} : {k:"bad", t:`FDS = ${fds} < 0,8: thiết kế chưa đủ điểm để dự đoán tin cậy – thêm Run hoặc giảm nhiễu.`});
  if (scope === "plan" || !P.design.length) return out;
  const lv = P.factors.map(f => new Set(P.design.map(r => r[f.key])).size);
  const exp = {CCD: 5, FCD: 3, BBD: 3}[P.designType];
  if (exp) P.factors.forEach((f, i) => { if (lv[i] !== exp) out.push({k:"warn", t:`Yếu tố ${f.key} (${f.name}) có ${lv[i]} mức trong ma trận, trong khi thiết kế ${P.designType} thường có ${exp} mức. Cần kiểm tra lại kiểu thiết kế hoặc ma trận.`}); });
  const c = centerInfo();
  if (c.n < 3) out.push({k:"bad", t:`Ma trận chỉ có ${c.n} điểm tâm: không ước lượng được sai số thuần và Lack of Fit. Cần tối thiểu 3 điểm tâm.`});

function derivedText(r){

function t0For(run){

/* Công thức tự đặt: tR[Tên pic], Rs[..], As[..], N[..], A[..] diện tích, H[..], k[..], t0; + − * / ^ ( ); abs min max sqrt log ln exp; dấu thập phân là dấu chấm, tách đối số bằng ; */
function evalExpr(src, get, t0){
  const s = String(src || ""); let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++; };
  const err = m => { throw new Error(m); };

    if (c === "-" || c === "−"){ i++; return -power(); }
    if (c === "+"){ i++; return power(); }
    const mn = s.slice(i).match(/^\d+(?:\.\d+)?(?:e[-+]?\d+)?/i); if (mn){ i += mn[0].length; return parseFloat(mn[0]); }
    const mid = s.slice(i).match(/^[A-Za-z][A-Za-z0-9]*/); if (!mid) err("ký tự lạ ở vị trí " + (i + 1));
    const id = mid[0]; i += id.length; ws();
    if (s[i] === "["){ const j = s.indexOf("]", i); if (j < 0) err("thiếu dấu ]"); const name = s.slice(i + 1, j).trim(); i = j + 1; const v = get(id, name); if (v === null || v === undefined) throw {na: true}; return v; }
    if (s[i] === "("){ const f = FN[id.toLowerCase()]; if (!f) err("không có hàm " + id); i++; const args = [add()]; ws(); while (s[i] === ";" || s[i] === ","){ i++; args.push(add()); ws(); } if (s[i] !== ")") err("thiếu dấu )"); i++; return f(...args); }
    if (id === "t0") return t0;
    err("không hiểu " + id);
  }
  function power(){ const b = primary(); ws(); if (s[i] === "^"){ i++; return Math.pow(b, power()); } return b; }
  function mul(){ let v = power(); for (;;){ ws(); const c = s[i]; if (c === "*" || c === "×" || c === "·"){ i++; v *= power(); } else if (c === "/"){ i++; v /= power(); } else return v; } }

const SCI_SKIP = new Set(["SCRIPT", "STYLE", "TEXTAREA", "INPUT", "SELECT", "OPTION", "CODE", "PRE", "SVG", "SUB", "SUP"]);
const SCI_HINT = /tR|t0|tM|tG|Rs|pK|λmax|Tf|Tmax|Pmax|V0|R²|\b[A-Z][a-z]?\d|\d[+\-−]\b|[A-Za-z][+\-]\B|cm\d|mm\d|-1\b|\$|\\/;
function sciDom(root){
  if (!root || typeof SCI === "undefined") return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){ let e = n.parentElement; while (e && e !== root){ if (SCI_SKIP.has(e.tagName) || (e.classList && (e.classList.contains("mono") || e.classList.contains("nosci")))) return NodeFilter.FILTER_REJECT; e = e.parentElement; } return n.nodeValue && SCI_HINT.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }});
  const list = []; while (w.nextNode()) list.push(w.currentNode);
  list.forEach(n => { const s = SCI.normalize(n.nodeValue); if (s === n.nodeValue || !/[_^]\{/.test(s)) return;
    const f = document.createDocumentFragment(); let pos = 0;
    s.replace(/([\p{L}\p{N}²'|]*)([_^])\{([^{}]{1,12})\}/gu, (m, base, k, a, off) => { if (off > pos) f.appendChild(document.createTextNode(s.slice(pos, off))); const w = document.createElement("span"); w.className = "sym"; w.textContent = base; const el = document.createElement(k === "_" ? "sub" : "sup"); el.textContent = a; w.appendChild(el); f.appendChild(w); pos = off + m.length; return m; });
    if (pos < s.length) f.appendChild(document.createTextNode(s.slice(pos))); n.parentNode.replaceChild(f, n); });
  root.querySelectorAll("option").forEach(o => { const u = SCI.toUnicode(o.textContent); if (u !== o.textContent) o.textContent = u; });
  root.querySelectorAll("[placeholder]").forEach(o => { const p = o.getAttribute("placeholder"); const u = SCI.toUnicode(p); if (u !== p) o.setAttribute("placeholder", u); });
}
